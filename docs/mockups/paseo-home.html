const KNOWN_PROJECTS=['SEICHO','Shiori','Paseo','food-core','Infrastructure','Crux','Pivolution','Quicklog'];
function identifyProject(text){const low=text.toLowerCase().replace(/pivoliution/g,'pivolution');const start=KNOWN_PROJECTS.find(p=>new RegExp('^\\s*'+p.toLowerCase().replace(/[-]/g,'[- ]')+'\\b','i').test(low));if(start)return start;return KNOWN_PROJECTS.find(p=>new RegExp('\\b'+p.toLowerCase().replace(/[-]/g,'[- ]')+'\\b','i').test(low))||''}
function inferInput(raw){
 const t=raw.trim();if(!t)return {kind:'',project:'',body:'',reason:''};
 const explicit=t.match(/^\s*([\w-]+)\s+(task|note|idea)\s*:\s*([\s\S]*)$/i);
 const p=explicit?KNOWN_PROJECTS.find(x=>x.toLowerCase()===explicit[1].toLowerCase()):identifyProject(t);
 if(explicit&&p)return {kind:explicit[2].toLowerCase()==='task'?'task':'note',project:p,body:explicit[3].trim(),reason:'Explicit command'};
 const prefix=t.match(/^\s*(task|note|idea)\s*:\s*([\s\S]*)$/i);
 if(prefix)return {kind:prefix[1].toLowerCase()==='task'?'task':'note',project:p,body:prefix[2].trim(),reason:'Explicit type'};
 if(/\b(task|implement|fix|bug|refactor)\s*:/i.test(t))return {kind:'task',project:p,body:t.replace(/^\s*[^:]{1,65}:\s*/,''),reason:'Task wording'};
 if(/\b(i want|would be nice|should|idea|remember|suggest|weekly|someday)\b/i.test(t))return {kind:'note',project:p,body:t,reason:'Possible idea or note'};
 return {kind:'note',project:p,body:t,reason:'Saved as a note unless you choose Task'};
}

 const x=inferred();if(!x.project){document.getElementById('quickProject')?.focus();toast('Choose a project first');return}
 if(!x.body){document.getElementById('quickText')?.focus();toast('Enter something first');return}

  if(state.quickStep!=='review'){quickDraft();return}
  const title=(document.getElementById('quickTitle')?.value||'').trim(),summary=(document.getElementById('quickSummary')?.value||'').trim(),accept=(document.getElementById('quickAcceptance')?.value||'').trim();

  if(existing){Object.assign(existing,{title,summary,acceptance:accept,project:x.project,approved:approve})}else{state.taskDrafts.unshift({id:'draft-'+Date.now(),title,summary,acceptance:accept,project:x.project,approved:approve})}

 }

if(a==='review'||a==='agent'||a==='queue'||a==='outcome'||a==='resume'||a==='catchup'||a==='focus'||a==='search'||a==='proposal'||a==='schedule'){open(a,id);return}
if(a==='showSuggestions'){state.showAllSuggestions=!state.showAllSuggestions;draw();return}
if(a==='dismissSuggestion'){state.data.suggestions=state.data.suggestions.filter(p=>p.id!==id);close();toast('Suggestion dismissed in preview');return}
if(a==='acceptSuggestion'){state.data.suggestions=state.data.suggestions.filter(p=>p.id!==id);close();toast('Task draft staged in preview · Requires review before queueing');return}
if(a==='approve'){let rv=state.data.reviews.find(r=>r.id===id);if(!rv)return;state.data.reviews=state.data.reviews.filter(r=>r.id!==id);close();toast('Review accepted in preview; Git finalization remains unverified');return}
if(a==='request'){const val=document.getElementById('changeComment')?.value.trim();if(!val){toast('Describe the changes you want first');return}let r=state.data.reviews.find(r=>r.id===id);if(r){r.description='Changes requested · '+val.slice(0,85)}close();toast('Changes requested in simulated Home state');return}
if(a==='startQueue'){let q=state.data.queue.find(r=>r.id===id);if(q){state.data.queue=state.data.queue.filter(r=>r.id!==id);state.data.agents.push({id:'queued',project:q.project,title:q.title,description:'Simulated agent run · local preview only',model:'Pi · provider not selected',activity:'Executing accepted Task through runner (simulated)'})}close();toast('Task started in preview only');return}
if(a==='mockAction'){close();toast(''+(id==='agent'?'New agent':id==='terminal'?'New terminal':id==='task'?'Draft Task':'Capture')+' is outside this Home-only mock');return}
if(a==='toggleFixture'){state.fixtureOpen=!state.fixtureOpen;draw();return}
if(a==='recent'||a==='changeFocus'){open(a);return}
if(a==='selectRecent'){if(id==='seicho'){state.data.resume='SEICHO · Recipe import reliability';state.data.lastContext='Browser preview + agent · ANON-PC';state.data.resumeState='Workspace saved · session idle';state.data.resumeContext={...state.data.resumeContext,why:'Improve reliable recipe importing.',leftOff:'Reviewing the import results and source mappings.',next:'Inspect the latest checks and decide whether the implementation is ready.',changes:'Latest checks were recorded.',source:'Recipe import workspace · example'}}else if(id==='food'){state.data.resume='food-core · URL importer';state.data.lastContext='Agent + terminal · anon3';state.data.resumeState='Verified run · session idle';state.data.resumeContext={...state.data.resumeContext,why:'Make URL recipe imports reliable.',leftOff:'Implementation finished and evidence was recorded.',next:'Review the saved result or choose another task.',changes:'Verified work was recorded for this workspace.',source:'food-core Task · example'}}close();toast('Last workspace changed; Focus unchanged');return}
if(a==='setFocus'){const opts={seicho:'SEICHO · Recipe import reliability',shiori:'Shiori · Reviewer results presentation',food:'food-core · Normalize Norwegian ingredient terms',clear:null};state.data.focus=opts[id]??null;close();toast('Focus updated; last workspace unchanged');return}
if(a==='openFocusTask'){const value=state.data.focus||'';if(value.startsWith('SEICHO'))open('review','seicho');else if(value.startsWith('Shiori'))open('review','shiori');else if(value.startsWith('food-core'))open('queue','q24');else close();return}
if(a==='queueAll'){open('allQueue');return}if(a==='activity'){open('activity');return}
if(a==='reset'){reset();toast('Fixture reset');return}
if(a==='project'){open('project',id);return}
if(a==='projects'||a==='work'||a==='tools'||a==='settings'||a==='split'){open('info',a);return}
}
document.addEventListener('pointerout',ev=>{const sw=ev.target.closest?.('#chatSwitch');if(sw&&!sw.contains(ev.relatedTarget))sw.classList.remove('chat-suppressed')});
document.addEventListener('click',ev=>{const btn=ev.target.closest('[data-action]');if(btn){ev.preventDefault();act(btn)}else if(ev.target.id==='overlay')close();else if(ev.target.id==='quickBackdrop')closeQuick();else if(state.chatPickerOpen&&!ev.target.closest('#chatSwitch')){state.chatPickerOpen=false;draw()}});
document.addEventListener('change',ev=>{
 if(ev.target.id==='scenario'){state.scenario=ev.target.value;reset(true)}
 if(ev.target.id==='quickKind'){state.quickMode=ev.target.value;updateQuickDynamic()}
 if(ev.target.id==='quickProject'){state.quickProject=ev.target.value;updateQuickDynamic()}
});
document.addEventListener('input',ev=>{
 if(ev.target.id==='changeComment')state.comment=ev.target.value;
 if(ev.target.id==='quickText'){state.quickText=ev.target.value;updateQuickDynamic()}
 if(ev.target.id==='quickTitle')state.quickTitle=ev.target.value;
 if(ev.target.id==='quickSummary')state.quickSummary=ev.target.value;
 if(ev.target.id==='quickAcceptance')state.quickAcceptance=ev.target.value;
});
document.addEventListener('keydown',ev=>{
 const editing=ev.target instanceof HTMLElement && (ev.target.matches('input,textarea,select')||ev.target.isContentEditable);
 const chatHotkey=ev.shiftKey&&!ev.altKey&&!ev.ctrlKey&&!ev.metaKey&&ev.code==='KeyE';
 if(chatHotkey&&!editing&&!state.quickOpen){ev.preventDefault();state.chatPickerOpen=!state.chatPickerOpen;draw();if(state.chatPickerOpen)document.querySelector('.chat-choice')?.focus({preventScroll:true});else document.getElementById('chatTrigger')?.focus({preventScroll:true});return}
 if(state.chatPickerOpen&&!state.quickOpen){
  if(ev.key==='Escape'){ev.preventDefault();state.chatPickerOpen=false;draw();document.getElementById('chatTrigger')?.focus({preventScroll:true});return}
  if(ev.altKey&&!ev.ctrlKey&&!ev.metaKey&&/^[1-4]$/.test(ev.key)){ev.preventDefault();open('sidechat',sidechats[Number(ev.key)-1].id);return}
  if(ev.key==='ArrowDown'||ev.key==='ArrowUp'){const options=[...document.querySelectorAll('.chat-choice')];const idx=options.indexOf(document.activeElement);if(idx!==-1){ev.preventDefault();options[(idx+(ev.key==='ArrowDown'?1:-1)+options.length)%options.length]?.focus();return}}
 }
 const hotkey=(ev.ctrlKey||ev.metaKey)&&ev.shiftKey&&ev.code==='KeyK';
 if(hotkey){ev.preventDefault();if(state.quickOpen){document.getElementById('quickText')?.focus()}else openQuick();return}
 if(state.quickOpen){
  if(ev.key==='Escape'){ev.preventDefault();closeQuick();return}
  if(ev.altKey&&!ev.ctrlKey&&!ev.metaKey){const k=ev.key.toLowerCase();if(k==='a'||k==='t'){ev.preventDefault();openShortcut(k==='a'?'agent':'terminal');return}if(k==='n'||k==='k'){ev.preventDefault();state.quickMode=k==='n'?'note':'task';state.quickStep='capture';draw();document.getElementById('quickText')?.focus();return}}
  if(ev.key==='Enter'&&!ev.shiftKey&&document.activeElement?.id==='quickText'){ev.preventDefault();quickSave();return}
  if(ev.key==='Enter'&&(ev.ctrlKey||ev.metaKey)&&state.quickStep==='review'){ev.preventDefault();quickSave();return}
  if(ev.key==='Tab'){const f=[...document.querySelectorAll('.qa-modal button:not([disabled]),.qa-modal input:not([disabled]),.qa-modal textarea:not([disabled]),.qa-modal select:not([disabled])')];const i=f.indexOf(document.activeElement);if(ev.shiftKey&&i===0){ev.preventDefault();f.at(-1)?.focus()}else if(!ev.shiftKey&&i===f.length-1){ev.preventDefault();f[0]?.focus()}}
  return;
 }
 if(ev.key==='Escape'&&state.drawer)close();
});
reset();
</script>
</body>
</html>
