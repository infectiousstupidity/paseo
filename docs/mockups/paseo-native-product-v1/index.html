('Open','tools','sm')}</div><div class="row between"><span>Schedules</span>${btn('Open','schedules','sm')}</div><div class="row between"><span>Hosts</span>${btn('Open','hosts','sm')}</div></div></div></div></div></div>`}
function projectView(){return `<div class="page wide">${header(`${state.project.toUpperCase()} · Project Home`,'Project identity · linked repository, workspaces, tasks and knowledge',`${btn('New agent','new-agent')}${btn('Capture','capture','primary')}${btn('Workspace','workspace:'+state.project+':main')}`)}<div class="tabs">${['Overview','Plan','Runs','Knowledge'].map(n=>`<button class="${state.section===n?'active':''}" data-action="project-tab:${n}">${n}</button>`).join('')}</div>${state.section==='Overview'?projectOverview():state.section==='Plan'?projectPlan():state.section==='Runs'?projectRuns():projectKnowledge()}</div>`}
function projectOverview(){return `<div class="grid two"><div class="stack"><div class="panel"><div class="panelhead"><b>Current outcome</b><span class="pill blue">In progress</span></div><div class="panelpad"><h2>Reliable Norwegian recipe intake</h2><p>Make URL → Mealie repeatable, with visible evidence and review before publishing.</p><div class="row wrap">${btn('Open plan','project-tab:Plan')}${btn('Run workspace','workspace:seicho:main')}${btn('Capture idea','capture')}</div></div></div><div class="panel"><div class="panelhead"><b>Attention in SEICHO</b><span class="meta">One shared review entity</span></div>${state.review==='needs'?`<div class="listitem clickable" data-action="inspect-review"><span class="pill amber">Needs review</span><div class="grow"><b>${id} · TASK-21</b><div class="meta">Recipe ingest navigation verification</div></div>${I('chevron')}</div>`:`<div class="panelpad">Review ${id} approved. ${link('Open receipt','inspect-review')}</div>`}<div class="listitem clickable" data-action="task:TASK-23"><span class="pill amber">Blocked</span><div class="grow"><b>TASK-23 · Publish integration</b><div class="meta">Waiting on accepted prototype and approval</div></div></div></div><div class="panel"><div class="panelhead"><b>Execution &amp; relationships</b>${btn('See runs','project-tab:Runs','sm')}</div><div class="panelpad"><div class="row between">Shiori execution <span class="pill">single authoritative queue</span></div><p class="meta">SEICHO personal project → Shiori software project → task → Paseo workspace → agent. Git is linked, not another project.</p><div class="row wrap">${btn('View active workspace','workspace:seicho:main','sm')}${btn('Open Git','git','sm')}</div></div></div></div><div class="stack"><div class="panel"><div class="panelhead"><b>Next decisions</b></div><div class="panelpad stack"><div><span class="eyebrow">Design</span><p>Prototype version ${state.prototypeAccepted?'v1 accepted':'v1 awaiting acceptance'}. Annotate before converting visuals into tasks.</p>${btn('Open prototype','prototype','sm')}</div><div class="divider"></div><div><span class="eyebrow">Plan</span><p>TASK-22 follows review; blocked TASK-23 must not jump ahead.</p>${btn('Inspect queue','project-tab:Plan','sm')}</div></div></div><div class="panel"><div class="panelhead"><b>Knowledge</b>${btn('All knowledge','project-tab:Knowledge','sm')}</div><div class="panelpad"><div class="row between"><span>Notes / questions / decisions</span><b>${3+state.captured.length}</b></div><p class="meta">Dictionary-first translation; no gas oven settings; verify Mealie write with disposable account.</p></div></div><div class="panel"><div class="panelhead"><b>Repository &amp; host</b></div><div class="panelpad"><div class="row between"><span>Git</span><span class="pill">${state.git}</span></div><div class="row between"><span>Host</span><span>ANON-PC</span></div><p class="meta">Last inspection is illustrative; Git actions only update prototype state.</p>${btn('Inspect changes','git','sm')}</div></div></div></div>`}
function projectPlan(){return `<div class="grid two"><div class="stack"><div class="panel"><div class="panelhead"><b>Feature · Recipe intake experience</b>${btn('New task proposal','capture','sm')}</div><div class="panelpad"><p class="meta">Proposal → accepted reference → serial authorized queue. Drag READY tasks or use Move buttons. Dependency constraints always win.</p><div class="row wrap">${['All','Ready','Blocked','Done'].map(x=>`<button class="btn sm ${state.stepFilter===x?'primary':''}" data-action="filter:${x}">${x}</button>`).join('')}</div></div>${state.queue.map((t,i)=>{let s=t==='TASK-23'?'Blocked':t==='TASK-21'?(state.review==='needs'?'Needs review':'Done'):t==='TASK-22'&&state.review==='needs'?'Blocked':'Ready';return state.stepFilter!=='All'&&state.stepFilter!==s?'':`<div class="listitem" draggable="${s==='Ready'}" data-task="${t}"><span class="pill ${s==='Blocked'||s==='Needs review'?'amber':s==='Done'?'good':'blue'}">${s}</span><div class="grow"><button data-action="task:${t}" style="text-align:left"><b>${t} · ${{'TASK-21':'Ingest layout','TASK-22':'Recipe QA','TASK-24':'Glossary cleanup','TASK-23':'Publish integration'}[t]}</b></button><div class="meta">${s==='Blocked'?'Depends on TASK-21 approval and accepted UI reference':t==='TASK-22'?'Dependency: accepted TASK-21 review':t==='TASK-24'?'No dependencies':'Reference: recipe-intake-v1'}</div></div><div class="row"><button class="iconbtn" data-action="move:${t}:-1" title="Move earlier" aria-label="Move ${t} earlier">↑</button><button class="iconbtn" data-action="move:${t}:1" title="Move later" aria-label="Move ${t} later">↓</button></div></div>`}).join('')}</div><div class="panel"><div class="panelhead"><b>Idea → accepted work</b></div><div class="panelpad"><div class="timeline">${['Capture idea / question','Planning conversation','UI prototype from approved profile','Annotate and accept reference','Generate tasks and authorize work'].map((x,i)=>`<div class="event"><b>${x}</b><div class="meta">${i<state.ideaStep?'Simulated step complete':i===state.ideaStep?'Next available action':'Not reached yet'}</div></div>`).join('')}</div>${btn(state.ideaStep===0?'Capture idea':state.ideaStep===1?'Open planning':state.ideaStep===2?'Preview prototype':state.ideaStep===3?'Accept version': 'Inspect task plan',state.ideaStep===0?'capture':state.ideaStep===1?'plan-chat':state.ideaStep===2?'prototype':state.ideaStep===3?'accept-prototype':'task:TASK-22','primary')}</div></div></div><div class="stack"><div class="panel"><div class="panelhead"><b>Task inspector</b></div><div class="panelpad"><div class="eyebrow">${state.task}</div><h2>${{'TASK-21':'Recipe ingest layout','TASK-22':'QA acceptance','TASK-24':'Glossary cleanup','TASK-23':'Publish integration'}[state.task]}</h2><p class="muted">${state.task==='TASK-23'?'Blocked: needs accepted reference and approved review. Cannot bypass admission.':'Task proposal is linked to the project, working branch, and run receipt.'}</p><div class="stack-tight"><div class="row between"><span>Status</span>${status(state.task==='TASK-23'||state.task==='TASK-22'&&state.review==='needs'?'Blocked':state.task==='TASK-21'?(state.review==='needs'?'Needs review':'Done'):'Ready')}</div><div class="row between"><span>Execution</span><span class="meta">Serial · explicit authorization</span></div><div class="row between"><span>Profile</span><span class="meta">${escape(state.profile)}</span></div></div><div class="divider"></div><div class="toolbar">${btn('Authorize run','authorize',state.task==='TASK-23'?'sm':'sm primary')}${btn('Linked workspace','workspace:seicho:main','sm')}${btn('Review','inspect-review','sm')}</div></div></div><div class="panel"><div class="panelhead"><b>Dependencies</b></div><div class="panelpad"><p class="meta">TASK-21 → TASK-22 → TASK-23. Reordering a blocked task cannot make it eligible.</p></div></div></div></div>`}
function projectRuns(){return `<div class="grid two"><div class="panel"><div class="panelhead"><b>Executions</b></div><div class="listitem clickable" data-action="workspace:seicho:main"><span class="dot ${state.run==='running'?'running':'review'}"></span><div class="grow"><b>${state.runId} · ${state.run==='running'?'Running':state.runTask==='TASK-21'&&state.review==='approved'?'Reviewed / approved':'Awaiting review'}</b><div class="meta">${state.runTask} · ANON-PC · Pi orchestrator · workspace/main</div></div>${btn('Open agent','workspace:seicho:main','sm')}</div><div class="listitem clickable" data-action="inspect-review"><span class="dot review"></span><div class="grow"><b>${id}</b><div class="meta">Three checks passed, one visual check needs your judgment</div></div>${btn('Inspect','inspect-review','sm')}</div></div><div class="panel panelpad"><h2>Authoritative status</h2><p>Execution exit alone does not mean Done. Review remains pending until approved; a simulated Git receipt is then recorded explicitly.</p>${btn('Review evidence','inspect-review','primary')}</div></div>`}

function projectsView(){return `<div class="page">${header('Projects','Persistent identities across linked repositories and workspaces',btn('Add Project','add-project','primary'))}<div class="panel">${projects.map(p=>`<div class="hoverrow" data-action="project:${p}"><span class="project-icon">${p[0].toUpperCase()}</span><div class="grow"><b>${p}</b><div class="meta">ANON-PC · linked directory and workspace</div></div>${I('chevron')}</div>`).join('')}</div></div>`}
function workspace(){let project=state.project;let isproposed=state.mode==='proposed';return `<div class="workspace"><div class="tabbar">${state.tabList.map(t=>`<div class="tabchip ${state.activeTab===t?'active':''}"><button data-action="tab:${t}" class="truncate">${I(t==='agent'?'bot':t==='terminal'?'terminal':t==='browser'?'browser':t==='diff'?'git':'file')} ${t==='agent'?(project==='shiori'?'Implement Shiori':'Implement Recipe UX'):t==='markdown'?'audit.md':t==='diff'?'Changes':t==='terminal'?'Terminal':t==='browser'?'Browser':t==='files'?'Files':t}</button><button aria-label="Close ${t}" title="Close ${t}" data-action="close-tab:${t}">×</button></div>`).join('')}<button class="iconbtn" title="New tab" data-action="new-tab">${I('plus')}</button><span class="grow"></span><button class="iconbtn" title="Split pane" data-action="toggle-split">${I('columns')}</button></div>${isproposed?`<div class="paneheader"><span class="pill blue">${state.run==='running'?'Running':state.run==='complete'?'Checked · review pending':'Session idle'}</span><div class="row">${['Focus','Activity','Full'].map(n=>`<button class="btn sm ${state.sessionMode===n?'primary':'quiet'}" data-action="session:${n}">${n}</button>`).join('')}</div><div class="grow"></div>${btn('Agents','agent-inspector','sm')}${btn('Review','inspect-review','sm')}</div>`:''}<div class="wsbody"><div class="wspane primary ${state.mobilePane==='second'?'hidden-mobile':''}">${paneBody()}</div>${state.secondary?`<div class="wspane secondary ${state.mobilePane==='second'?'visible':''}"><div class="paneheader"><span>${I('file')} ${state.panel==='diff'?'src/recipe-import.ts · Diff':state.panel==='files'?'Explorer · Files':state.panel==='git'?'Git changes':state.panel==='browser'?'Browser · Prototype':'audit.md · Preview'}</span><div class="grow"></div>${['markdown','diff','files','browser','git'].map(t=>`<button class="iconbtn" title="${t}" aria-label="Show ${t} pane" data-action="pane:${t}">${I(t==='diff'||t==='git'?'git':t==='browser'?'browser':t==='files'?'folder':'file')}</button>`).join('')}</div><div class="scrollable" style="flex:1">${secondaryPane()}</div></div>`:''}</div><div class="mobiletop" style="justify-content:space-between;height:36px"><button data-action="mobilepane:agent">Agent</button><button data-action="mobilepane:second">Supporting pane</button><button data-action="agent-inspector">Inspector</button></div></div>`}
