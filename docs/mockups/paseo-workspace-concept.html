.reset-demo{display:inline-flex;align-items:center;gap:6px;margin-left:auto;border:0;background:none;color:var(--weak);font-size:11px;padding:5px 8px;border-radius:6px}
.reset-demo:hover{background:var(--hover);color:var(--text)}
.reset-demo.armed{color:var(--amber)}
@media(max-width:700px){.reset-demo{min-height:44px}}
/* W1b pane host — .panes is display:contents so each .sidepane is a direct flex item of .workspace (avoids circular % sizing) */
.panes{display:contents}
.sidepane{display:flex;flex-direction:column;background:#19191b;border-left:1px solid var(--line);overflow:hidden;min-width:0;position:relative;z-index:2}
.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 20px;border-bottom:1px solid var(--line);min-height:55px;flex-shrink:0}
.pane-title{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.7px;font-weight:700;color:var(--sub);text-transform:uppercase;min-width:0}
.pane-title .ico{color:var(--muted)}
.pane-id{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:10px;letter-spacing:0;text-transform:none;color:var(--weak);font-weight:400}
.pane-ctl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.pane-back{display:none}
/* W2 — component map (projection view) */
.map-layout{flex:1;min-height:0;display:flex;overflow:auto}
.map-tree{width:290px;flex:0 0 290px;padding:22px 14px 40px;border-right:1px solid var(--line-soft)}
.map-tree h2{font-size:17px;font-weight:650;letter-spacing:-.3px;margin:0}
.map-sub{font-size:12px;color:var(--sub);margin:6px 0 18px;line-height:1.5}
.map-node-row{display:flex;align-items:center;gap:2px;min-height:34px}
.map-twist{width:24px;height:24px;flex:0 0 24px}
.map-twist-sp{flex:0 0 24px;display:inline-block}
.map-node{flex:1;display:flex;align-items:center;gap:8px;text-align:left;background:none;border:1px solid transparent;border-radius:6px;padding:6px 8px;color:var(--sub);font-size:12.5px;min-width:0}
.map-node:hover{background:var(--hover);color:var(--text)}
.map-node.selected{background:#26212b;border-color:#6c5877;color:var(--text)}
.map-node .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-node .status-dot{width:7px;height:7px;flex-shrink:0}
.uncertain-dot{width:6px;height:6px;border-radius:50%;background:var(--amber);flex-shrink:0}
.map-panel{flex:1;min-width:0;padding:22px 26px 40px;max-width:720px}
.map-note{margin:0 0 4px 30px;font-size:11px;color:var(--amber)}
.map-inline{margin:2px 0 8px;padding:10px 12px;background:#252128;border-left:2px solid #78657b;border-radius:0 6px 6px 0;font-size:12px;color:var(--sub);line-height:1.55}
.map-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.map-capture{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:8px;background:#1c1b1f;display:flex;flex-direction:column;gap:8px}
.map-capture .formlabel{margin:0}
.map-capture-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:700px){
.map-layout{flex-direction:column;overflow:auto}
.map-tree{width:auto;flex:none;border-right:0;border-bottom:1px solid var(--line-soft);padding:16px 15px 10px}
.map-panel{max-width:none;padding:16px 15px 60px}
.map-capture-actions .btn{min-height:44px}
}
/* W2 — planning session, promotion, protected proposal, receipts */
.plan-block{max-width:735px;margin:0 auto 18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#1d1b20;display:flex;flex-direction:column;gap:10px}
.plan-block .formlabel{margin:0}
.plan-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.scope-chip{display:inline-flex;align-items:center;gap:7px;background:var(--purple-bg);color:var(--purple);border-radius:6px;padding:5px 9px;font-size:11.5px;font-weight:580;max-width:100%;overflow-wrap:anywhere}
.packet summary{cursor:pointer;color:var(--sub);font-size:12px;font-weight:600;display:flex;align-items:center;gap:7px;flex-wrap:wrap}

.promo-opt input{accent-color:var(--amber);margin-top:2px;flex-shrink:0}
.promotion-actions{display:flex;justify-content:flex-end;margin-top:10px}
mark{background:#3b3128;color:#f6d09d;padding:0 3px;border-radius:3px}
.prop-block{background:#18181a;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:12.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 0 14px}

.menu-row:hover{background:var(--hover);color:var(--text)}
.menu-row.active{background:#29252d;color:#f4edf8;font-weight:590;box-shadow:inset 0 0 0 1px #39323e}
.layout-modal{width:min(370px,100%)}

/* W3a — Documents work tab: provenance, staleness, navigable state */
.docs-view{flex:1;min-height:0;overflow:auto;padding:22px 26px 40px}
.docs-inner{max-width:820px;margin:0 auto}
.docs-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.docs-top h2{font-size:17px;font-weight:650;letter-spacing:-.3px;margin:0}
.docs-top .map-sub{margin:6px 0 0}
.doc-group{margin:18px 0 4px;font-size:10px;letter-spacing:1px;font-weight:750;color:#a39ba6;text-transform:uppercase}
.doc-row{display:grid;grid-template-columns:1fr auto;gap:2px 16px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:11px 12px;color:var(--sub);min-height:48px}
.doc-row:hover{background:var(--hover);color:var(--text)}
.doc-title{display:block;font-size:13px;font-weight:600;color:var(--text);line-height:1.3}
.doc-path{display:block;font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.doc-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.doc-state{font-size:10px;font-weight:650;padding:2px 7px;border-radius:5px;border:1px solid var(--line)}
.doc-state.ok{color:var(--complete);border-color:#556166;background:#2d3435}
.doc-state.stale{color:var(--amber);border-color:#69563e;background:#3b3128}
.doc-state.unavailable{color:var(--red);border-color:#6d4246;background:#39292a}
.count-chip{font-size:10px;color:var(--muted);border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;white-space:nowrap}
.doc-back{margin-bottom:16px}
.doc-back .ico{transform:scaleX(-1)}
.doc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.doc-excerpt{margin-top:6px;padding:15px 16px;background:#1d1b20;border:1px solid var(--line);border-radius:10px}
.doc-excerpt .detail-para{font-size:13px;line-height:1.65}
.doc-unavail{display:flex;gap:11px;align-items:flex-start;margin-top:6px;padding:14px 16px;border:1px dashed #6d4246;border-radius:10px;background:#241d1e;color:var(--sub);font-size:12.5px;line-height:1.55}
.doc-unavail .ico{margin-top:1px;color:var(--red)}
.doc-unavail .btn{margin-top:8px}
.doc-sections .ctx-row.active{background:#26212b;box-shadow:inset 0 0 0 1px #6c5877;color:var(--text)}
.ctx-row.static{color:var(--weak);cursor:default}
.ctx-row.static:hover{background:none;color:var(--weak)}
@media(max-width:700px){
.docs-view{padding:16px 15px 60px}
.doc-row{grid-template-columns:1fr;min-height:0;padding:13px 12px}
.doc-meta{justify-content:flex-start;margin-top:6px}
.doc-actions .btn,.doc-unavail .btn{min-height:44px}
}
/* W3b — supporting context list in the shiori pane */
.ctx-sec-head{display:flex;align-items:baseline;gap:8px;margin:13px 0 3px;font-size:11px;font-weight:650;color:var(--muted)}
.ctx-sec-head .task-id{font-weight:400}
.ctx-hint{margin:10px 0 0;font-size:11px;color:var(--weak)}
/* W4a — session registry: transcript layout, identity header, sessions view, task identity block */
.agent-message.user{display:flex;flex-direction:column;align-items:flex-end}
.agent-message.user .role{margin-left:auto;max-width:100%}
.agent-message.user .text{max-width:100%;overflow-wrap:anywhere}
.agent-message.system{text-align:center}
.ses-ident{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.head-chips{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.head-chip{display:inline-flex;align-items:center;gap:6px;background:var(--purple-bg);color:var(--purple);border-radius:6px;padding:3px 8px;font-size:11px;font-weight:580;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sessions-view{flex:1;min-height:0;overflow:auto;padding:22px 26px 40px}
.sessions-view .docs-inner{max-width:820px}
.sessions-hint{margin:0 0 14px;color:var(--muted);font-size:12px}
.session-row{flex-direction:column;align-items:flex-start;gap:9px}
.session-row .doc-meta{justify-content:flex-start}
.session-row .doc-title .ico{vertical-align:-4px}
.task-identity{max-width:735px;margin:0 auto 18px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:#1d1b20;display:flex;flex-direction:column;gap:10px}
.task-identity .detail-id{margin-bottom:0}
.task-identity h3{margin:0;font-size:14px;font-weight:640;overflow-wrap:anywhere}
.task-identity ul{margin:6px 0 0;padding-left:18px;color:var(--sub);font-size:12.5px;line-height:1.6}
.working-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--sub)}
.working-dot{width:9px;height:9px;border-radius:50%;background:var(--blue);display:inline-block;flex-shrink:0;animation:working-pulse 1.5s ease-in-out infinite}
@keyframes working-pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media(max-width:700px){
.sessions-view{padding:16px 15px 60px}
.sessions-view .docs-top .btn,.task-identity .btn{min-height:44px}
.no-session-list .btn{min-height:44px}
}
/* W4b — independent side questions (R13): selection ask menu, side pane, send-to-main */
.agent-ctl{display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0}
.sel-ask{position:fixed;z-index:50;display:none;background:var(--raised2);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:4px;min-width:220px}
.sel-ask.open{display:block}
.sel-ask .menu-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;min-height:38px}
.sel-ask .menu-row .ico{vertical-align:-4px}
.sel-ask .menu-row small{color:var(--weak);font-size:10px}
.sel-ask .menu-row:disabled{opacity:.55}
.sel-ask .menu-row:disabled:hover{background:none;color:var(--sub)}
.modal .menu-row{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.modal .menu-row small{color:var(--weak);font-size:10px}
.side-ref{display:inline-flex;align-items:center;gap:6px;background:var(--purple-bg);color:var(--purple);border-radius:6px;padding:5px 9px;font-size:11.5px;font-weight:580;max-width:100%;overflow-wrap:anywhere}
.side-quote{margin:10px 0 4px;padding:10px 12px;border-left:2px solid #78657b;background:#252128;border-radius:0 6px 6px 0;color:var(--sub);font-size:12.5px;line-height:1.55;overflow-wrap:anywhere}
.side-ctx{display:flex;align-items:center;gap:7px;color:var(--sub);font-size:12px;margin:6px 0 2px;cursor:pointer}
.side-ctx input{accent-color:var(--purple)}
.side-compose{border-top:1px solid var(--line);margin-top:16px;padding-top:14px}
.pane-head{flex-wrap:wrap;row-gap:8px}
@media(max-width:700px){
.sel-ask{left:10px;right:10px;bottom:62px;top:auto;min-width:0}
.side-ctx{min-height:44px}
.side-quote{font-size:14px}
}
/* W5a — execution spine, readiness, queue (R7). Run state lives only in store.runs. */
.run-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:11px;color:var(--sub);margin:0 0 4px}
.run-spine{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.spine-step{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--raised);color:var(--sub);border-radius:6px;padding:5px 9px;font-size:11.5px;min-height:30px;overflow-wrap:anywhere}
.spine-step:hover{background:var(--hover);color:var(--text)}
.spine-step.selected{background:#26212b;border-color:#aa91be;color:var(--text)}
.spine-step.succeeded{color:var(--complete)}
.spine-step.running{color:var(--blue);border-color:#45586b}
.spine-step.failed{color:var(--red);border-color:#6d4246}
.spine-step.stopped{color:var(--amber);border-color:#69563e}
.spine-step.pending{color:var(--weak)}
.step-detail{margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#1c1b1f;min-width:0}
.step-prov{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin:0 0 6px}
.evt-row{display:flex;gap:8px;align-items:baseline;padding:5px 0;border-top:1px solid var(--line-soft);font-size:12px;color:var(--sub);line-height:1.5}
.evt-row:first-of-type{border-top:0}
.evt-row .ico{width:14px;height:14px;flex-shrink:0;transform:translateY(2px);color:var(--muted)}
.evt-row .task-id{margin-left:auto;flex-shrink:0}
.evidence-block{margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#18181a;font-size:11.5px;color:var(--sub)}
.evidence-block code{display:block;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:11.5px;color:var(--text);overflow-wrap:anywhere;margin-bottom:5px}
.att-row{margin-top:8px;padding:8px 10px;border:1px solid var(--line-soft);border-radius:7px;font-size:11.5px;color:var(--sub)}
.att-row.failed,.att-row.aborted{border-color:#6d4246}
.att-row summary{cursor:pointer;color:var(--sub);font-weight:600;list-style:none}
.att-row summary::-webkit-details-marker{display:none}
.att-reason{font-size:11px;margin-top:4px;color:var(--red)}
.att-reason.abort{color:var(--amber)}
.ready-row{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:12px;align-items:baseline}
.ready-row:first-of-type{border-top:0}
.ready-label{flex:0 0 122px;color:var(--muted);font-size:11px}
.ready-value{flex:1;min-width:0;color:var(--sub);line-height:1.5;overflow-wrap:anywhere}
.ready-value.ok{color:var(--muted)}
.ready-value.bad{color:var(--red)}
.ready-value.warn{color:var(--amber)}
.verdict-chip{display:inline-flex;align-items:center;gap:5px;border-radius:5px;padding:2px 8px;font-size:10.5px;font-weight:650;border:1px solid var(--line)}
.verdict-chip.ready{color:var(--complete);border-color:#556166;background:#2d3435}
.verdict-chip.blocked{color:var(--red);border-color:#6d4246;background:#39292a}
.verdict-chip.unknown{color:var(--amber);border-color:#69563e;background:#3b3128}
.queue-head{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 4px}
.queue-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line-soft);font-size:12px;color:var(--sub);min-width:0}
.queue-row .task-id{flex-shrink:0}
.queue-note{font-size:10.5px;color:var(--weak);margin-left:auto;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.linked-btn{background:none;border:0;padding:0;color:var(--purple);font:inherit;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.linked-btn:hover{color:var(--text)}
@media(max-width:700px){.spine-step{min-height:44px}.ready-label{flex-basis:94px}.queue-row .btn{min-height:44px}}
/* W5b — run controls: Stop/Resume/Restart/Cancel + generation switcher (R17). State lives only in store.runs. */
.run-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0 2px}
.run-notice{margin:8px 0 0;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#1c1b1f;font-size:12px;color:var(--sub);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;line-height:1.5}
.run-notice.warn{border-color:#705f4e;background:#322b26;color:#f0cf9e}
.run-gen{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.agent-runbar{padding:12px 30px;border-bottom:1px solid var(--line-soft);background:#171719;display:flex;flex-direction:column;gap:8px;flex-shrink:0}
.pill.cancelled{background:#2d3435;border-color:#556166;color:#d8e3e7}
/* W6 — task review pane and finalization surface. */
.review-pane{max-width:920px;margin:0 auto;padding-bottom:22px}
.review-identity{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:9px;background:#1d1b20;overflow-wrap:anywhere}
.review-identity h2{font-size:17px;margin:0;line-height:1.35}
.review-meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--sub);font-size:11px;align-items:center}
.review-verdict{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.review-find{padding:12px;border:1px solid #705f4e;background:#29231e;border-radius:8px;margin:8px 0;color:var(--sub);line-height:1.55}
.review-file{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:9px 8px;border:0;border-top:1px solid var(--line-soft);background:none;color:var(--sub);font-size:12px;overflow-wrap:anywhere}
.review-file:hover,.review-file.active{background:var(--hover);color:var(--text)}
.review-file span:last-child{margin-left:auto;white-space:nowrap;color:var(--muted)}
.review-diff{white-space:pre-wrap;overflow-wrap:anywhere;background:#171719;border:1px solid var(--line);border-radius:7px;padding:11px;font:11px/1.55 ui-monospace,"Cascadia Code",Consolas,monospace;color:var(--sub)}
.review-diff .add{color:var(--complete);background:#b5c1c714}.review-diff .del{color:var(--red);background:#efa5a114}
.review-claims{width:100%;border-collapse:collapse;font-size:11.5px}.review-claims th,.review-claims td{text-align:left;vertical-align:top;padding:8px;border-top:1px solid var(--line-soft);overflow-wrap:anywhere}.review-claims th{color:var(--muted)}
.review-check{display:flex;gap:8px;align-items:flex-start;padding:11px;border:1px solid var(--line);border-radius:8px;color:var(--sub);font-size:12px;line-height:1.55;margin:12px 0}
.review-check input{accent-color:var(--purple);margin-top:3px;flex-shrink:0}
.review-final{padding:14px;border:1px solid var(--line);border-radius:9px;background:#1d1b20}
.review-proof{border-left:2px solid var(--purple);padding:8px 10px;color:var(--sub);font:11px/1.55 ui-monospace,"Cascadia Code",Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#18181a}
.review-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.review-actions .btn{white-space:normal}
.review-approve{color:var(--complete)}
@media(max-width:700px){.review-pane{padding:0 15px 60px}.review-actions .btn{min-height:44px;width:100%}.review-file{min-height:44px}.review-claims{font-size:11px}.review-claims th,.review-claims td{padding:7px 5px}}
.review-diff{white-space:pre-wrap;overflow-wrap:anywhere;background:#171719;border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--complete);font:11px/1.6 ui-monospace,Consolas,monospace}
@media(max-width:700px){.review-diff{font-size:10px}.sidepane[data-pane="review"] .inspector-content{padding-bottom:80px}}
/* W7 — guided review queue + cross-project return surface (R9/R10). Rows are plain flex; actions wrap at compact. */
.review-surface{max-width:1100px;margin:0 auto;padding-bottom:40px}
.gq-row{display:flex;align-items:center;gap:12px;padding:14px 8px;border-top:1px solid var(--line-soft);min-height:70px;flex-wrap:wrap}
.gq-type{width:28px;min-width:28px;height:28px;display:grid;place-items:center}
.gq-type.QUESTION{color:var(--purple)}
.gq-type.PROPOSAL{color:var(--blue)}
.gq-type.TASKREVIEW{color:var(--amber)}
.gq-type.RUNNING{color:var(--blue)}
.gq-type.DONE{color:var(--complete)}
.gq-main{flex:1;min-width:220px;display:flex;flex-direction:column;gap:4px;text-align:left;background:none;border:0;color:var(--text);padding:4px 0}
.gq-main:hover .gq-title{color:var(--purple)}
.gq-title{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.gq-chip{font-size:10px;font-weight:650;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:1px 7px;white-space:nowrap}
.gq-ctx{font-size:11.5px;color:var(--muted);line-height:1.5}
.gq-state.running{color:var(--blue)}
.gq-state.stopped,.gq-state.stopping{color:var(--amber)}
.gq-actions{display:flex;gap:8px;flex-wrap:wrap}
.gq-row.handled .gq-main{min-width:0}
button.receipt-row{width:100%;text-align:left;background:none;border:0;color:inherit;font:inherit;cursor:pointer}
@media(max-width:700px){
.gq-row{padding:14px 0}
.gq-main{min-width:100%}
.gq-actions{width:100%}
.gq-actions .btn{min-height:44px;flex:1}
}
/* W8a — native structured requests (R11): inline transcript cards. Distinct from Task Review, ordinary replies and annotations (the legend line says so explicitly). */
.req-card{max-width:735px;margin:0 auto 22px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--purple);border-radius:10px;background:#1d1b20;display:flex;flex-direction:column;gap:9px}
.req-card.permission{border-left-color:var(--amber)}
.req-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.req-title{font-size:12.5px;font-weight:650}
.req-scope{margin:0;font-size:11px;color:var(--muted)}
.req-text{margin:0;font-size:12.5px;color:var(--sub);line-height:1.6;overflow-wrap:anywhere}
.req-opt{display:flex;gap:9px;align-items:flex-start;padding:5px 0;font-size:12.5px;color:var(--sub);line-height:1.5}
.req-opt input{accent-color:var(--purple);margin-top:2px;flex-shrink:0}
.req-other{margin:2px 0 2px 27px;max-width:420px}
.req-actions{display:flex;gap:8px;flex-wrap:wrap}
.req-outcome{margin:0;font-size:12px;color:var(--sub);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.req-legend{margin:0;border-top:1px solid var(--line-soft);padding-top:8px;font-size:10.5px;color:var(--weak);line-height:1.5}
.req-badge{color:var(--amber);border-color:#69563e}
@media(max-width:700px){.req-actions .btn{min-height:44px;flex:1}.req-opt{min-height:40px}.req-other{max-width:none;margin-left:25px}}
/* W8b — annotations, bundles, explicit routing (R12). Demo storage only (PROPOSED design). */
.ann-chip{cursor:pointer;border:1px solid transparent}
.ann-chip:hover{border-color:#6c5877;background:#3a2f45}
.ann-badge{color:var(--purple);border-color:#5a4b66}
.ann-composer{position:fixed;z-index:60;display:none;width:340px;max-width:calc(100vw - 20px);max-height:calc(100dvh - 20px);overflow:auto;background:var(--raised2);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:14px}
.ann-composer.open{display:block}
.ann-comp-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ann-comp-head .pane-title{text-transform:none}
.ann-comp-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px}
.ann-quote{margin:0 0 8px}
.ann-draft{border:1px solid var(--line-soft);border-radius:8px;padding:10px 12px;margin:8px 0;background:#1c1b1f}
.ann-text{margin:0 0 8px;font-size:12.5px;color:var(--sub);line-height:1.55;overflow-wrap:anywhere}
.ann-sent{max-width:735px;margin:0 auto 22px;display:flex;flex-direction:column;gap:6px}
.ann-sent-row{border:1px solid var(--line-soft);border-radius:8px;background:#19191c;padding:8px 10px}
.ann-sent-row summary{cursor:pointer;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);list-style:none}
.ann-sent-row summary::-webkit-details-marker{display:none}
.ann-sent-row .ann-quote{margin:8px 0 4px}
@media(max-width:700px){
.ann-composer{left:0!important;right:0;top:49px;bottom:54px;width:auto;max-width:none;max-height:none;border-radius:0}
.ann-comp-actions .btn{min-height:44px;flex:1}
.ann-sent-row summary{min-height:44px}
.ann-draft .req-actions .btn{min-height:44px}
}
/* W9a — task drafting: 3-stage dialog (setup → drafting run → editable canonical Task Markdown). Structural validation is fixture-focused, never repository verification. */
.draft-doc{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:12.5px;line-height:1.6}
.draft-val{display:flex;flex-direction:column;gap:4px}
.draft-val-row{display:flex;align-items:baseline;gap:7px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.draft-val-row .mark.ok{color:var(--complete)}
.draft-val-row .mark.bad{color:var(--red)}
.draft-val-row .hint{color:var(--weak);font-size:11px}
.draft-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:21px}
.draft-actions .btn{white-space:normal}
.draft-switch{margin:2px 0 10px;padding:8px;border:1px solid var(--line-soft);border-radius:8px;background:#1c1b1f;display:flex;flex-direction:column;gap:4px}
@media(max-width:700px){.draft-doc{font-size:12px}.draft-actions .btn{min-height:44px;flex:1}}
/* W9b — task file intake (R15): quiet classified-file dialog. Invalid = muted diagnostic, never urgency styling. */
.intake-row{display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:11px 12px;color:var(--sub);min-height:52px}
.intake-row:hover{background:var(--hover);color:var(--text)}
.intake-kind{font-size:10px;font-weight:650;padding:2px 7px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}
.intake-kind.new{color:var(--complete);border-color:#556166;background:#2d3435}
.intake-kind.needs_preparation{color:var(--amber);border-color:#69563e;background:#3b3128}
.intake-kind.invalid{color:var(--muted);border-color:var(--line);background:#26252a}
.intake-kind.archived{color:var(--blue);border-color:#45586b;background:#25313b}
.intake-invalid{padding:12px 14px;border:1px dashed var(--line);border-radius:10px;background:#1c1b1f;color:var(--muted);font-size:12.5px;line-height:1.6}
.intake-invalid .task-id{color:var(--muted)}
@media(max-width:700px){.intake-row{padding:13px 12px}.intake-actions .btn{min-height:44px;flex:1}}
/* W10a — subagent track (R16): compact strip + inline panel above the agent composer.
   Children of a run are a parallel track; control failures are muted, shown once. */
.subtrack{border-top:1px solid var(--line-soft);background:#171719;flex-shrink:0}
.subtrack-strip{display:flex;align-items:center;gap:9px;width:100%;padding:11px 20px;background:none;border:0;color:var(--text);font-size:12.5px;text-align:left}
.subtrack-strip:hover{background:var(--hover)}
.subtrack-title{font-weight:650}
.subtrack-counts{color:var(--muted);font-size:11.5px}
.subtrack-strip .ico:last-child{margin-left:auto;color:var(--weak)}
.subtrack-strip.open .ico:last-child{transform:rotate(180deg)}
.subtrack-panel{padding:4px 20px 16px;display:flex;flex-direction:column;gap:2px;max-height:46dvh;overflow:auto}
.subtrack-sec{margin-top:8px}
.child-row{display:flex;align-items:center;gap:8px;min-width:0}
.child-rowhead{flex:1;display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:7px;padding:9px 10px;color:var(--sub);font-size:12.5px;min-width:0}
.child-rowhead:hover{background:var(--hover);color:var(--text)}
.child-rowhead.expanded{background:#26212b;box-shadow:inset 0 0 0 1px #6c5877;color:var(--text)}
.child-role{width:24px;height:24px;min-width:24px;display:grid;place-items:center;border-radius:6px;background:#2c2830;color:var(--sub)}
.child-main{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;min-width:0}
.child-main strong{color:var(--text);font-size:12.5px;font-weight:600;overflow-wrap:anywhere}
.child-main small{color:var(--muted);font-size:11.5px;overflow-wrap:anywhere}
.child-chip{font-size:10px;font-weight:650;padding:2px 7px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}
.child-chip.running{color:var(--blue);border-color:#45586b;background:#25313b}
.child-chip.finished{color:var(--complete);border-color:#556166;background:#2d3435}
.child-chip.failed{color:var(--red);border-color:#6d4246;background:#39292a}
.child-chip.stopping{color:var(--amber);border-color:#69563e;background:#3b3128}
.child-chip.stopped{color:var(--muted);border-color:var(--line);background:#26252a}
.child-open{background:none;border:0;color:var(--purple);font-size:11.5px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;flex-shrink:0}
.child-open:hover{color:var(--text)}
.child-expand{margin:2px 0 10px;padding:12px;border:1px solid var(--line);border-radius:9px;background:#1c1b1f;display:flex;flex-direction:column;gap:8px;min-width:0}
.child-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.child-status{padding:10px 12px;border:1px solid var(--line-soft);border-radius:7px;background:#18181a;font-size:12px;color:var(--sub);display:flex;flex-direction:column;gap:3px}
.child-steer{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.child-steer .field{flex:1;min-width:190px;max-width:420px;padding:8px 10px;font-size:12.5px}
.child-steer-line{margin:0;font-size:11.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.child-steer-line.delivered{color:var(--complete)}
.child-task{margin:0;font-size:12.5px;color:var(--text);line-height:1.6;overflow-wrap:anywhere}
.child-result{margin:0;font-size:12px;color:var(--sub);line-height:1.55;overflow-wrap:anywhere}
.child-ctlerr{margin:0;font-size:11px;color:var(--weak);line-height:1.5}
.child-defer{margin:0;font-size:11px;color:var(--muted);display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
@media(max-width:700px){
.subtrack-strip{padding:13px 15px;min-height:44px}
.subtrack-panel{padding:2px 15px 16px}
.child-rowhead{padding:13px 10px;min-height:44px}
.child-open{min-height:44px;display:inline-flex;align-items:center}
.child-actions .btn{min-height:44px;flex:1}
.child-steer .field{min-height:44px;font-size:16px}
.child-defer .src-tag{white-space:normal;word-break:break-all}

/* W10b — usage strip (Agent view) + usage pane (R19). Read-only demo telemetry:
   no controls, no store mutation. The collapsed strip wraps to ≤2 lines at compact. */
.usage-track{border-top:1px solid var(--line-soft);background:#171719;flex-shrink:0}
.usage-striprow{display:flex;align-items:center;gap:4px;padding:0 20px}
.usage-strip{flex:1;min-width:0;display:flex;align-items:center;gap:9px;flex-wrap:wrap;row-gap:4px;padding:10px 0;background:none;border:0;color:var(--text);font-size:12px;text-align:left}
.usage-strip:hover{background:var(--hover)}
.usage-model{font-family:ui-monospace,"Cascadia Code",Consolas,monospace;font-size:11.5px;font-weight:600;white-space:nowrap}
.usage-state{font-size:10px;font-weight:650;padding:2px 7px;border-radius:5px;border:1px solid var(--line);white-space:nowrap}
.usage-state.active{color:var(--blue);border-color:#45586b;background:#25313b}
.usage-state.idle{color:var(--muted);border-color:var(--line);background:#26252a}
.usage-state.error{color:var(--red);border-color:#6d4246;background:#39292a}
.usage-state.unavailable{color:var(--amber);border-color:#69563e;background:#3b3128}
.usage-age{font-size:10px;font-weight:650;padding:2px 7px;border-radius:5px;border:1px solid #69563e;background:#3b3128;color:var(--amber);white-space:nowrap}
.usage-bar{width:92px;height:5px;border-radius:3px;background:#2d2c31;overflow:hidden;display:inline-block;flex-shrink:0}
.usage-bar i{display:block;height:100%;border-radius:3px;background:var(--muted)}
.usage-bar.amber i{background:var(--amber)}
.usage-bar.red i{background:var(--red)}
.usage-pct,.usage-rate,.usage-note{color:var(--muted);font-size:11px;white-space:nowrap}
.usage-strip .ico:last-child{margin-left:auto;color:var(--weak)}
.usage-strip.open .ico:last-child{transform:rotate(180deg)}
.usage-link{border:0;background:none;color:var(--purple);font-size:11.5px;text-decoration:underline;text-underline-offset:2px;white-space:nowrap;flex-shrink:0;padding:2px 0}
.usage-link:hover{color:var(--text)}
.usage-tech{padding:2px 20px 14px;display:flex;flex-direction:column;gap:8px}
.usage-tech-grid{display:grid;grid-template-columns:190px 1fr;gap:5px 14px;font-size:12px;background:#1c1b1f;border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.usage-k{color:var(--muted)}
.usage-v{color:var(--sub);overflow-wrap:anywhere}
.usage-flag{margin:0;font-size:11.5px;line-height:1.5;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.usage-flag.stale{color:var(--amber)}
.usage-flag.error{color:var(--red)}
.usage-flag.unavail{color:var(--muted)}
.usage-view{max-width:780px;margin:0 auto;padding-bottom:22px;display:flex;flex-direction:column;gap:10px}
.usage-view-note{margin:0;color:var(--muted);font-size:12px;line-height:1.55}
.usage-row{border:1px solid var(--line);border-radius:9px;background:#1c1b1f;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.usage-rowhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;min-width:0}
.usage-rowhead .usage-bar{width:110px}
.usage-rowmeta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11.5px;color:var(--muted);min-width:0}
.usage-quota{margin-top:6px;padding:14px;border:1px solid var(--line);border-radius:9px;background:#1d1b20;display:flex;flex-direction:column;gap:10px}
.usage-quota .usage-bar{width:140px;height:6px}
.usage-quota-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
@media(max-width:700px){
.usage-striprow{padding:0 15px}
.usage-strip{padding:13px 0;min-height:44px}
.usage-striprow .usage-bar{width:72px}
.usage-tech{padding:0 15px 14px}
.usage-tech-grid{grid-template-columns:1fr;gap:2px 0;padding:12px}
.usage-tech-grid .usage-k{margin-top:6px}
.usage-link{min-height:44px;display:inline-flex;align-items:center;padding:0 6px}
.usage-row{padding:14px}
.usage-rowhead .usage-bar,.usage-quota .usage-bar{width:90px}
}
/* W11a — PROPOSED Agentation scenario view + project linkage/recovery (R21/R20). */
.agent-banner{padding:12px 14px;border:1px solid #69563e;background:#322b26;color:#f0cf9e;border-radius:8px;font-size:12.5px;line-height:1.5;margin:0 0 14px}
.agent-batch{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.agent-note{border:1px solid var(--line);border-radius:9px;background:#1c1b1f;padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.agent-note-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.agent-note-title{font-weight:600;font-size:13px;min-width:0;overflow-wrap:anywhere}
.agent-chip{font-size:10px;border:1px solid var(--line);border-radius:5px;padding:1px 6px;white-space:nowrap;color:var(--muted)}
.agent-chip.investigating,.agent-chip.implemented{color:var(--blue);border-color:#45586b}
.agent-chip.proposed,.agent-chip.approved{color:var(--purple);border-color:#6c5877}
.agent-chip.verified{color:var(--complete);border-color:#556166}
.agent-chip.failed{color:var(--red);border-color:#6d4246}
.agent-chip.uncertain{color:var(--amber);border-color:#69563e}
.agent-chip.rejected{color:var(--weak)}
.agent-detail{margin:0;color:var(--sub);font-size:12px;line-height:1.5;overflow-wrap:anywhere}
.agent-audit{margin:0;padding:8px 0 0;border-top:1px solid var(--line-soft);list-style:none;font-size:11px;line-height:1.7;color:var(--muted)}
.agent-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.agent-flow{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:0 0 6px}
.agent-flow-box{border:1px solid var(--line);background:var(--raised);border-radius:7px;padding:6px 10px;font-size:11.5px;color:var(--sub);white-space:nowrap}
.agent-flow-arrow{color:var(--weak)}
.agent-defer{margin:0;padding-left:18px;color:var(--muted);font-size:12px;line-height:1.8}
.agent-defer b{color:var(--sub);font-weight:600}
.agent-boundary{margin:8px 0 0;color:var(--muted);font-size:12px;line-height:1.6}
.quietchip{border:1px solid var(--line-soft);background:transparent;color:var(--muted);border-radius:6px;font-size:10.5px;padding:4px 9px;white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.quietchip:hover{background:var(--hover);color:var(--text)}
.repo-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--raised);color:var(--sub);border-radius:6px;font-size:10.5px;padding:2px 7px;white-space:nowrap}
.ws-chip{display:inline-flex;align-items:center;gap:5px;border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:6px;font-size:10.5px;padding:2px 7px;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;white-space:nowrap}
.project-chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.proj-rowwrap{display:flex;align-items:center;gap:1px;min-width:0}
.proj-rowwrap .nav-link{flex:1;min-width:0;padding-right:4px}
.proj-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj-kebab{opacity:0;transition:opacity .12s;flex-shrink:0;width:30px;height:32px}
.proj-rowwrap:hover .proj-kebab,.proj-kebab:focus-visible{opacity:1}
.proj-state-chip{margin-left:6px;font-size:9px;letter-spacing:.4px;text-transform:uppercase;border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;color:var(--muted);white-space:nowrap}
.proj-state-chip.unlinked{color:var(--amber);border-color:#69563e}
.proj-state-chip.missing{color:var(--red);border-color:#6d4246}
.proj-state-chip.deleted{color:var(--weak)}
.link-surface{max-width:720px;margin:40px auto;padding:26px;border:1px solid #69563e;background:#252128;border-radius:10px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.link-surface h2{margin:0;font-size:19px;letter-spacing:-.4px}
.link-surface .map-actions{margin-top:6px}
.manage-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft);flex-wrap:wrap}
.manage-row small{display:block;color:var(--muted);font-size:11px;margin-top:2px}
@media(max-width:700px){
.agent-note{padding:14px}
.agent-actions .btn,.agent-note .prop-confirm .btn{min-height:44px}
.agent-flow-box{white-space:normal}
.quietchip{min-height:44px}
.proj-kebab{opacity:1;width:44px;height:44px}
.link-surface{margin:16px 0;padding:20px}
.link-surface .btn,.manage-row .btn{min-height:44px}
}
/* W16 — guided tour (owner walkthrough): hint line, card/sheet, highlight. In-memory only. */
.tour-target{outline:2px solid var(--purple)!important;outline-offset:3px;box-shadow:0 0 0 5px #cfb9e42b,0 8px 30px #000a!important;border-radius:6px}
.tour-hint{display:flex;align-items:center;gap:9px;margin:10px 26px 0;padding:8px 12px;background:var(--surface);border:1px solid var(--line-soft);border-radius:8px;font-size:12px;color:var(--muted)}
.tour-hint button{border:0;background:none;color:var(--purple);font-size:12px;padding:2px 4px;min-height:28px}
.tour-hint .hint-x{margin-left:auto;color:var(--weak);display:grid;place-items:center;width:28px;height:28px;border-radius:6px}
.tour-hint .hint-x:hover{background:var(--hover);color:var(--text)}
.tour-card{position:fixed;right:18px;bottom:18px;z-index:46;width:min(352px,calc(100vw - 36px));background:var(--raised2);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;max-height:calc(100dvh - 96px)}
.tour-head{display:flex;align-items:center;gap:9px;padding:11px 12px 11px 15px;border-bottom:1px solid var(--line-soft)}
.tour-kicker{font-size:10px;font-weight:750;letter-spacing:1px;text-transform:uppercase;color:var(--weak)}
.tour-journey{font-size:11.5px;color:var(--purple);font-weight:600}
.tour-counter{margin-left:auto;font-size:11px;color:var(--weak);white-space:nowrap}
.tour-head .iconbtn{width:26px;height:26px}
.tour-body{padding:13px 15px;overflow:auto;min-height:0}
.tour-title{font-size:14px;line-height:1.35;font-weight:650;letter-spacing:-.2px;margin:0 0 8px}
.tour-say{font-size:12px;line-height:1.55;color:var(--sub);margin:0}
.tour-note{margin:10px 0 0;font-size:11.5px;color:var(--muted)}
.tour-note.warn{color:var(--amber)}
.tour-actions{display:flex;gap:7px;padding:11px 12px;border-top:1px solid var(--line-soft);align-items:center}
.tour-actions .btn{flex:1;min-height:34px}
.tour-skip{border:0;background:none;color:var(--weak);font-size:11px;padding:6px 4px;min-height:34px;white-space:nowrap}
.tour-skip:hover{color:var(--text)}
@media(max-width:700px){

.tour-actions .btn,.tour-skip{min-height:44px}
}

<script>
(()=>{
'use strict';
const icon=(name,cls='')=>`<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

    store.layout.widths=[p,0.84-p];

function childControlAction(action,childId){
  if(action==='strip'){state.childPanel=!state.childPanel;saveStore();render();return;}
  const c=(store.children||[]).find(x=>x.id===childId);
  if(!c)return;
  if(action==='expand'){state.childExpanded=state.childExpanded===childId?null:childId;saveStore();render();return;}
  if(action==='status'){state.childStatus=state.childStatus===childId?null:childId;saveStore();render();return;}
  if(action==='stop'&&c.state==='running'&&c.controllable){state.childArm={child:childId,action:'stop'};saveStore();render();return;}
  if(action==='arm-clear'){state.childArm=null;saveStore();render();return;}
  if(action==='stop-go'){
    if(!(state.childArm&&state.childArm.child===childId&&state.childArm.action==='stop'))return;
    state.childArm=null;c.state='stopping';
    const rcpt=addReceipt('run',`${childId} stop requested — parent run unaffected (demo)`);
    saveStore();render();alertToast(rcpt.work+' · '+rcpt.id);return;
  }
  if(action==='stop-observed'&&c.state==='stopping'){
    c.state='stopped';
    c.result='stopped by user at '+fmtTime(now())+' (demo)';
    const rcpt=addReceipt('run',`${childId} stopped by user — parent run unaffected (demo)`);
    saveStore();render();alertToast(rcpt.work+' · '+rcpt.id);return;
  }
  if(action==='steer'){
    if(!(c.state==='running'&&c.controllable))return;

    const text=inp?inp.value.trim():'';
    if(!text){alertToast('Type a steer line first.');return;}
    const at=now();
    // Scripted next beat: one PRE-queued steer becomes delivered (system line in the
    // child session); the newly sent steer stays queued — no fake instant delivery.
    const pre=(c.steerQueue||[]).filter(q=>q.state==='queued');

      if(s)s.messages.push({role:'system',text:'Steer delivered (demo): '+pre[0].text,at});
    }
    saveStore();render();return;
  }
}

/* ---- W3b — supporting context: Questions / Decisions / Notes / Ideas.

let ctxDrawId=null,ctxMode='view';
const CTX_ICON={q:'info',dec:'check',note:'document',idea:'activity'};

const shortText=(s,n)=>s.length>n?s.slice(0,n-1).trimEnd()+'…':s;
const ctxRecord=id=>{

  const arr=k==='q'?store.questions:k==='dec'?store.decisions:k==='note'?store.notes:k==='idea'?store.ideas:null;

const ctxProjectRO=r=>{const p=projects.find(x=>x.id===r.project);return !!(p&&p.readOnly)||r.project==='crux';};
function ctxLinks(id){
  const keys=['tasks','docs','decisions','questions','ideas'];
  const out={tasks:[],docs:[],decisions:[],questions:[],ideas:[]};
  const add=rel=>keys.forEach(k=>(rel[k]||[]).forEach(x=>{if(x!==id&&!out[k].includes(x))out[k].push(x);}));
  Object.values(store.map).forEach(m=>(m.nodes||[]).forEach(n=>{const rel=n.related||{};if(keys.some(k=>(rel[k]||[]).includes(id)))add(rel);}));
  store.docs.forEach(d=>(d.sections||[]).forEach(s=>{const rel=s.related||{};if(keys.some(k=>(rel[k]||[]).includes(id)))add(rel);}));

}
function ctxChips(links){

    out.push(t?`<button class="ctx-row" data-suptask="${t.project}/${t.id}"><span>${icon('board','sm')} ${escapeHtml(t.project)}/${t.id} · ${escapeHtml(t.title)}</span><span class="end">${statusNames[t.status]}</span></button>`

  (links.decisions||[]).forEach(id=>{const d=store.decisions.find(x=>x.id===id);if(d)out.push(`<button class="ctx-row" data-supctx="${id}"><span>${icon('check','sm')} ${escapeHtml(d.title)}</span><span class="end">${escapeHtml(d.state)} · rev ${d.rev}</span></button>`);});
  (links.questions||[]).forEach(id=>{const x=store.questions.find(y=>y.id===id);if(x)out.push(`<button class="ctx-row" data-supctx="${id}"><span>${icon('info','sm')} ${escapeHtml(shortText(x.text,70))}</span><span class="end">${escapeHtml(x.state)}</span></button>`);});

function ideaSource(r){

function openSupport(id){

    }

    const became=r.state.startsWith('Became task');

      if(r.state==='Captured')actions=`<div class="modal-actions"><button class="btn primary" data-ideaact="explore">Start exploring</button><button class="btn" data-ideaact="dismiss">Dismiss</button><button class="btn" data-dismiss>Close</button></div>`;
      else if(r.state==='Exploring')actions=`<div class="modal-actions"><button class="btn primary" data-ideaact="ready">Mark ready to decide</button><button class="btn" data-ideaact="defer">Defer</button><button class="btn" data-ideaact="dismiss">Dismiss</button><button class="btn" data-dismiss>Close</button></div>`;
      else if(r.state==='Ready to decide')actions=`<div class="modal-actions"><button class="btn primary" data-ideaact="accept">Accept as work</button><button class="btn" data-ideaact="defer">Defer</button><button class="btn" data-ideaact="dismiss">Dismiss</button><button class="btn" data-dismiss>Close</button></div>`;
      else if(r.state==='Deferred')actions=`<div class="modal-actions"><button class="btn" data-ideaact="dismiss">Dismiss</button><button class="btn" data-dismiss>Close</button></div>`;

function ideaAct(r,act){

function ideaAcceptAsWork(r){

function bindDocArea(){

  a.querySelectorAll('[data-docsec]').forEach(b=>b.onclick=()=>{state.docSection=b.dataset.docsec;renderDocArea();});
  const back=a.querySelector('#docBack');
  if(back)back.onclick=()=>{state.docDoc=null;state.docSection=null;state.docHistory=null;renderDocArea();};
  const ref=a.querySelector('#docRefresh');
  if(ref)ref.onclick=()=>{
    const d=curDoc();if(!d||d.state!=='stale')return;
    const from=d.rev;
    d.rev=d.sourceRev||d.rev+1;delete d.sourceRev;
    d.state='ok';d.updatedAt=now();d.refreshed=true;
    state.docHistory=null;

    alertToast(rcpt.work+' · '+rcpt.id);
    renderDocArea();
  };

  if(his)his.onclick=()=>{const d=curDoc();if(d)state.docHistory=d.id;renderDocArea();};
  const retry=a.querySelector('#docRetry');

    d.tried=(d.tried||0)+1;
    if(d.tried<2){alertToast('Still unavailable — source path missing in this demo snapshot (demo).');saveStore();return;}
    d.state='ok';d.updatedAt=now();
    const rcpt=addReceipt('document',`Document snapshot resolved: ${d.id.replace(/^doc:/,'').replace(/@rev:\d+$/,'')} rev ${d.rev}`);
    alertToast(rcpt.work+' · '+rcpt.id);
    renderDocArea();
  };
  a.querySelectorAll('[data-doctask]').forEach(b=>b.onclick=()=>openTask(b.dataset.doctask,b.dataset.docproject));
  a.querySelectorAll('[data-docdec]').forEach(b=>b.onclick=()=>openDecisionDetail(b.dataset.docdec));
  a.querySelectorAll('[data-docq]').forEach(b=>b.onclick=()=>openSupport(b.dataset.docq));

}

function draftSectionLines(doc,name){

// Fixture-focused structural validation — never repository verification.
function draftValidate(doc){

    {label:'H1 present',pass:String(doc||'').split('\n').some(l=>/^# \S/.test(l)),hint:'Add a level-1 heading line (# Title)'},
    {label:'Outcome section',pass:!!(outcome&&outcome.some(l=>l.trim())),hint:"Add a '## Outcome' section with 2–3 sentences"},
    {label:'Acceptance ≥1 bullet',pass:!!(acc&&acc.some(l=>/^\s*[-*]\s+\S/.test(l))),hint:"Add at least one '- ' bullet under ## Acceptance"},

function intakeParse(doc){

  const acc=(draftSectionLines(doc,'Acceptance')||[]).filter(l=>/^\s*[-*]\s+\S/.test(l)).map(l=>l.replace(/^\s*[-*]\s+/,'').trim());

  const d=prefillTaskDraft(f.project,{title:p.title,outcome:p.outcome,area:defaultAreaFor(f.project),acceptance:p.acceptance.length?p.acceptance:undefined,fromIntake:f.id});
  d.doc=f.doc;d.generatedDoc=f.doc;d.projectId=f.project;
  d.runLog=['Intake: parsed task file '+f.path+' (demo)'];
  d.stage='edit';
  draftDrawProject=f.project;
  saveStore();
  drawDraft();
  alertToast(mode==='start'?'Draft prefilled from intake — choose Add & start there (W5 readiness rules apply)':'Draft prefilled from intake — confirm Add to create the task');
}
function intakeAcceptPrep(f){
  f.classification='new';f.state='prepared';f.doc=f.preparedDoc;
  f.preparedAt=now();f.preparedBy='user:demo';
  addReceipt('intake','Preparation accepted for '+f.id+' — importable (demo)');
  saveStore();drawIntake();
  alertToast('Preparation accepted — '+f.id+' is importable now (demo)');
}
function intakeDismiss(f){
  f.state='rejected';f.dismissedAt=now();f.dismissedBy='user:demo';
  const rcpt=addReceipt('intake','Intake '+f.id+' dismissed — related task unaffected (demo)');
  intakeFileId=null;saveStore();drawIntake();
  alertToast(rcpt.work+' · '+rcpt.id);
}
function intakeAcceptRecon(f){
  const t=findTask(f.taskRef||'');if(!t)return;
  t.doc=f.path;
  t.audit=(t.audit||[]).concat([{text:'Reconciled to archived path (demo)',at:now(),by:'user:demo'}]);
  f.state='imported';f.reconciled=true;f.reconciledAt=now();
  const rcpt=addReceipt('intake',`Reconciled ${f.taskRef} → ${f.path} (demo)`);
  saveStore();drawIntake();
  alertToast(rcpt.work+' · '+rcpt.id);
}

function agentationNoteRow(n){
  const actions=n.state==='proposed'
    ?(agentationArm===n.id
      ?`<div class="prop-confirm"><span>Approve exact proposal at ${escapeHtml(n.propSha||'sha256:— (demo)')} (demo)? Demo flow: approved → implemented (fresh implementer) → verified + receipt.</span><span class="prop-confirm-actions"><button class="btn" data-agg="back">Back</button><button class="btn primary" data-agg="approve:${n.id}">Approve again</button></span></div>`
      :`<div class="agent-actions"><button class="btn primary" data-agg="arm-approve:${n.id}">Approve exact proposal (${escapeHtml(n.propSha||'sha256:— (demo)')})</button><button class="btn" data-agg="reject:${n.id}">Reject</button></div>`)

function drawAgentation(){
  const b=store.agentation.batch;

    const n=b.notes.find(x=>x.id===agentationNote);
    body=n?`<p class="criteria-note" style="margin-top:-6px">The original annotation text, unmodified. Viewing never submits or approves anything.</p><div class="prop-block">${escapeHtml(n.text)}</div><p class="detail-id" style="margin-top:10px">${escapeHtml(n.revision)} · <span class="agent-chip ${n.state}">${n.state}</span> <span class="demo-tag">demo</span></p><div class="modal-actions"><button class="btn" data-agg="back-note">Back to scenario</button><button class="btn" data-dismiss>Close</button></div>`:`<p class="detail-para">Note not found.</p>`;
  }else{
    body=`<div class="agent-banner">PROPOSED integration — not proven. This scenario demonstrates the intended flow with demo data. No proven transport exists in the mock.</div>
<div class="agent-batch"><span class="agent-chip">${escapeHtml(b.id)}</span><span class="agent-detail">Source: ${escapeHtml(b.source)}</span><span class="demo-tag">demo</span></div>
<h4 class="section-head" style="margin:12px 0 6px">Flow (intended pipeline)</h4>
<div class="agent-flow">${['Handoff','Per-note investigation','Proposal','Separate approval','Implementation','Verification receipt'].map((x,i)=>`${i?'<span class="agent-flow-arrow">→</span>':''}<span class="agent-flow-box">${x}</span>`).join('')}</div>

<h4 class="section-head" style="margin:14px 0 4px">Boundaries</h4>
<p class="agent-boundary">Original feedback preserved — every note links to its full original text, unmodified. Proven transport: none — proposed only.</p>
<p class="agent-boundary">No duplicate annotation picker in this view; no auto-dispatch — chat-comment/annotation sends (W8) never create agentation notes (demo).</p>
<h4 class="section-head" style="margin:14px 0 4px">Deferred</h4>
<ul class="agent-defer">${AGENT_DEFER.map(([name,src])=>`<li><b>${escapeHtml(name)}</b> — deferred — no control in this mock. <span class="src-tag">source reference</span> ${escapeHtml(src)}</li>`).join('')}</ul>`;
  }
  mountOverlay(`<dialog class="modal" aria-labelledby="agentTitle"><div class="modal-head"><h2 id="agentTitle">${agentationNote?'Original feedback — '+escapeHtml(agentationNote):'Proposed Agentation integration scenario'}</h2><button class="iconbtn" data-dismiss aria-label="Close">${icon('close')}</button></div>${body}</dialog>`);

      n.audit=n.audit||[];
      n.state='proposed';
      n.propSha=n.propSha||'sha256:c9d04e57 (demo)';
      n.detail='pending approval — reconciled (demo) — proposal at '+n.propSha;
      n.audit.push({text:'reconciled (demo) — acknowledgment re-fetched: uncertain → proposed',at:now()});
      saveStore();drawAgentation();alertToast(n.id+' reconciled — now proposed (demo)');
    }
  });
}

   Unlink/delete/simulate-missing only change the LINK, never the records;
   delete is available for the seeded demo project only (core projects are
   protected deliberately). crux stays read-only — no read-write control. ---- */

function drawManage(pid){
  const p=projects.find(x=>x.id===pid);if(!p)return;
  const link=p.link||'linked';
  const isDemo=p.id==='demo';
  const armed=manageArm&&manageArm.id===pid?manageArm.action:null;
  const strip=(action,confirm,confirmLabel)=>armed===action
    ?`<div class="prop-confirm"><span>${escapeHtml(confirm)}</span><span class="prop-confirm-actions"><button class="btn" data-manage-act="back">Back</button><button class="btn" data-manage-act="confirm-${action}">${escapeHtml(confirmLabel)}</button></span></div>`
    :'';
  const actions=[
    (link==='linked'&&armed!=='unlink')?`<button class="btn" data-manage-act="unlink">Unlink project</button>`:(link!=='linked'?'<span class="quiettext">Unlink — link already changed</span>':''),
    (link==='linked'&&isDemo&&armed!=='delete')?`<button class="btn" data-manage-act="delete">Delete project</button>`:(link==='linked'&&isDemo?'':`<button class="btn" data-manage-act="delete" disabled>Delete project</button><small>core demo project — delete is deliberately unavailable</small>`),
    (isDemo&&link==='linked')?`<button class="btn" data-manage-act="simulate">Simulate missing project (demo)</button>`:'',
    (link!=='linked')?`<button class="btn primary" data-manage-act="restore">Restore</button><button class="btn" data-manage-act="remove">Remove reference</button>`:''
  ].join('');
  mountOverlay(`<dialog class="modal" aria-labelledby="manageTitle"><div class="modal-head"><h2 id="manageTitle">Manage — ${escapeHtml(p.name)}</h2><button class="iconbtn" data-dismiss aria-label="Close">${icon('close')}</button></div>

${p.readOnly||p.id==='crux'?'<p class="criteria-note">Read-only project (demo).</p><p class="criteria-note">read-write ownership is a Shiori project decision — not a Paseo control (demo).</p>':''}
${link!=='linked'?`<p class="context-note" style="border-color:#69563e">Link state: ${escapeHtml(link)} (demo) — records intact in demo storage.</p>`:''}
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">${actions}</div>
${strip('unlink',`Unlink ${p.name} from this workspace? Its records remain in demo storage.`,'Unlink')}
${strip('delete',`Delete ${p.name}? Its task records remain in demo storage.`,'Delete')}
<p class="criteria-note" style="margin-top:14px">Link changes never touch records. Restore re-links; Remove reference hides the row while storage keeps everything (demo).</p>
<div class="modal-actions"><button class="btn" data-dismiss>Close</button></div></dialog>`);
  el('overlayRoot').querySelectorAll('[data-manage-act]').forEach(btn=>btn.onclick=()=>{
    const act=btn.dataset.manageAct;
    if(act==='back'){manageArm=null;drawManage(pid);return;}
    if(act==='unlink'){manageArm={id:pid,action:'unlink'};drawManage(pid);return;}
    if(act==='delete'){if(!isDemo)return;manageArm={id:pid,action:'delete'};drawManage(pid);return;}
    if(act==='simulate'){p.link='missing';manageArm=null;closeOverlays();saveStore();render();alertToast(p.name+' marked missing (demo) — records intact');return;}
    if(act==='confirm-unlink'){p.link='unlinked';manageArm=null;closeOverlays();saveStore();render();alertToast(p.name+' unlinked from this workspace — records remain (demo)');return;}
    if(act==='confirm-delete'){p.link='deleted';manageArm=null;closeOverlays();saveStore();render();alertToast(p.name+' deleted from this workspace — records remain (demo)');return;}
    if(act==='restore'){p.link='linked';manageArm=null;closeOverlays();saveStore();render();alertToast(p.name+' re-linked — records intact (demo)');return;}
    if(act==='remove'){
      p.removed=true;manageArm=null;
      if(state.project===pid){const next=projects.find(x=>!x.removed&&x.id!==pid);state.project=next?next.id:projects.find(x=>!x.removed).id;}
      closeOverlays();saveStore();render();alertToast(p.name+' reference removed — records kept in demo storage (demo)');return;
    }
  });
}

  say:'Stop asks you to confirm the run and step, then reports liveness as unknown until you confirm the observed stop. Completed steps are preserved and a receipt records the stop; unlike Cancel, Stop can be resumed.',
  done:()=>{const t=tourFindIntakeTask();const r=t&&runFor(t);return !!r&&r.state!=='running';},
  act:()=>{if(!tclick(TD_SEL+' [data-runc="stop"]'))return false;if(!tclick(TD_SEL+' [data-runc="stop-go"]'))return false;return tclick(TD_SEL+' [data-runc="observed"]');},
  target:TD_SEL+' .run-notice'},
 {j:'When things go sideways',title:'Resume continues the same run',
  say:'Resume continues the same run, generation and step, recording another attempt. If the task document no longer matched what the run reviewed, the UI would explain why Resume is unavailable and point to a new attempt instead.',
  done:()=>{const t=tourFindIntakeTask();const r=t&&runFor(t);return !!(r&&r.state==='running'&&r.resumeNote);},
  act:()=>tclick(TD_SEL+' [data-runc="resume"]'),
  target:TD_SEL+' .run-notice'},
 {j:'When things go sideways',title:'Cancel is terminal — unlike Stop',
  say:'Cancel the already-stopped seicho/I-01 run. Its confirmation says it cannot be undone, and the task becomes terminally Cancelled; unlike Stop, it cannot be resumed, and any Focus on it is cleared.',
  done:()=>{const t=findTask('seicho/I-01');return !!t&&t.status==='cancelled';},
  act:()=>{const t=findTask('seicho/I-01');if(!t)return false;openTask(t.id,t.project);if(!tclick(TD_SEL+' [data-runc="cancel"]'))return false;return tclick(TD_SEL+' [data-runc="cancel-go"]');},
  target:TD_SEL+' .run-ctl'},
 {j:'When things go sideways',title:'Focus is an explicit attention marker',
  say:'Set Focus on the idea-derived task to park it on your attention list. Focus is not an execution command, and starting or moving between tasks never sets it for you; Done and Cancelled tasks cannot keep it.',
  done:()=>{const t=tourFindIntakeTask();return !!t&&state.focused===t.project+':'+t.id;},
  act:()=>{const t=tourFindIntakeTask();if(!t)return false;openTask(t.id,t.project);const fb=document.querySelector('#focusBtn');if(!fb)return false;if(fb.textContent.indexOf('Set focus')>=0)fb.click();return state.focused===t.project+':'+t.id;},
  target:()=>document.querySelector('#focusPill')?'#focusPill':'#detailTitle'},
 {j:'When things go sideways',title:'Exploration is not accepted planned work',
  say:'Open seicho/P-02 and look for its “Exploration record — not accepted planned work” label. Exploration is a boundary, not a planned task; it is useful to investigate, but it is not accepted work.',
  act:()=>{const p=findTask('seicho/P-02');if(!p)return false;if(!tclick('[data-task="P-02"][data-task-project="seicho"]'))openTask(p.id,p.project);return true;},
  target:'#explorationNote'},
 {j:'When things go sideways',title:'Crux is read-only in this demo',
  say:'Switch to Crux and open Draft task. Its read-only guard disables Generate and refuses task creation at Add, so you can inspect the project without being shown a write path.',
  act:()=>{if(!tclick('[data-project="crux"]'))goProject('crux');return tclick('#createTask');},
  target:'#draftReadOnly'},
 {j:'Finish',finish:true,title:'That\'s the core loop',
  say:'You walked three journeys: (1) morning intake — supporting context, an idea accepted into a draft, committed to the board with a provenance receipt; (2) a day with a task — Start, the execution spine, review, the exact-work gate, approval, finalization, Done with a merged receipt; (3) when things go sideways — Stop with honest liveness, same-step Resume, terminal Cancel, explicit Focus, and the exploration + read-only boundaries. This tour changed real demo state (a task was created and finished, a run cancelled, a task focused). Reset below to restore the seeded walkthrough.',
  target:null}
]};
function tourCardMarkup(){
  const s=tour.steps[tour.idx],n=tour.idx+1,total=tour.steps.length;
  const head='<div class="tour-head"><span class="tour-kicker">Guided tour</span><span class="tour-journey">'+escapeHtml(s.j)+'</span><span class="tour-counter">Step '+n+' of '+total+'</span><button class="iconbtn" id="tourSkipX" aria-label="Skip tour">'+icon('close','sm')+'</button></div>';
  let body,actions;
  if(s.finish){
    body='<h3 class="tour-title">'+escapeHtml(s.title)+'</h3><p class="tour-say">'+escapeHtml(s.say)+'</p>';
    actions='<div class="tour-actions"><button class="btn" id="tourBack">Back</button><button class="btn primary '+(tour.resetArmed?'urgent':'')+'" id="tourReset"><span>'+(tour.resetArmed?'Click again to confirm reset':'Reset demo')+'</span></button><button class="btn" id="tourDone">Finish</button></div>';
  }else{
    body='<h3 class="tour-title">'+escapeHtml(s.title)+'</h3><p class="tour-say">'+escapeHtml(s.say)+'</p>'+(tour.note?'<p class="tour-note">'+escapeHtml(tour.note)+'</p>':'')+(tour.degraded?'<p class="tour-note warn">Not available in current state — Reset demo to restore the seeded walkthrough.</p>':'');
    actions='<div class="tour-actions"><button class="btn" id="tourBack" '+(n===1?'disabled':'')+'>Back</button><button class="btn primary" id="tourNext">Next</button><button class="tour-skip" id="tourSkip">Skip tour</button></div>';
  }
  return head+'<div class="tour-body">'+body+'</div>'+actions;
}
function tourRenderCard(){
  const c=el('tourCard');if(!c)return;
  if(!tour.active){c.innerHTML='';c.classList.add('hidden');return;}
  c.classList.remove('hidden');
  c.innerHTML=tourCardMarkup();
  c.querySelector('#tourSkipX').onclick=tourSkip;
  c.querySelector('#tourBack').onclick=tourBack;
  const nx=c.querySelector('#tourNext');if(nx)nx.onclick=tourNext;
  const sk=c.querySelector('#tourSkip');if(sk)sk.onclick=tourSkip;
  const dn=c.querySelector('#tourDone');if(dn)dn.onclick=tourSkip;
  const rs=c.querySelector('#tourReset');
  if(rs)rs.onclick=()=>{
    if(!tour.resetArmed){tour.resetArmed=true;tourRenderCard();tour.resetTimer=setTimeout(()=>{tour.resetArmed=false;if(tour.active)tourRenderCard();},4000);return;}
    clearTimeout(tour.resetTimer);tour.resetArmed=false;
    localStorage.removeItem(STORAGE_KEY);location.reload();
  };
}
function tourApplyHighlight(){
  document.querySelectorAll('.tour-target').forEach(e=>e.classList.remove('tour-target'));
  if(!tour.active)return true;
  const s=tour.steps[tour.idx];
  const sel=typeof s.target==='function'?s.target():s.target;
  if(!sel)return true;
  const e=document.querySelector(sel);
  if(!e||!e.getClientRects().length)return false;
  e.classList.add('tour-target');
  const r=e.getBoundingClientRect();
  if(r.top<0||r.left<0||r.bottom>innerHeight||r.right>innerWidth){
    try{e.scrollIntoView({block:'center',behavior:'smooth'});}catch(x){}
  }
  return true;
}
function tourStepEnter(runAction){
  const s=tour.steps[tour.idx];
  tour.degraded=false;tour.note='';
  if(runAction){
    if(s.done&&s.done())tour.note='Already completed earlier in this walkthrough — not re-run.';
    else{
      let ok=true;
      try{ok=s.act?s.act():true;}catch(e){ok=false;}
      if(ok===false)tour.degraded=true;
    }
  }
  if(!tourApplyHighlight())tour.degraded=true;
  tourRenderCard();
}
function tourStart(){
  if(tour.active)return;
  tour.active=true;tour.idx=0;tour.hintGone=true;tour.resetArmed=false;
  if(state.project!=='seicho'||state.tab!=='project'||state.section!=='work')goProject('seicho');
  else renderMain();
  tourStepEnter(true);
}
function tourNext(){if(tour.idx<tour.steps.length-1){tour.idx++;tourStepEnter(true);}}
function tourBack(){if(tour.idx>0){tour.idx--;tourStepEnter(false);}}
function tourSkip(){
  tour.active=false;tour.resetArmed=false;clearTimeout(tour.resetTimer);
  document.querySelectorAll('.tour-target').forEach(e=>e.classList.remove('tour-target'));
  tourRenderCard();
  renderMain();
}
function bindStatic(){
  makeReset(el('resetFooter'));
  el('hamburger').onclick=()=>{el('sidebar').classList.toggle('open');el('hamburger').setAttribute('aria-expanded',el('sidebar').classList.contains('open'));};
  el('navWorkspace').onclick=showWork;el('navReviews').onclick=showReviews;el('navSessions').onclick=showSessions;
  el('navCommand').onclick=openCommand;el('navInfo').onclick=()=>openInfo();el('addTab').onclick=newChat;el('commandBtn').onclick=openCommand;el('settingsBtn').onclick=()=>openInfo();el('tourBtn').onclick=()=>tourStart();
  el('navReceipts').onclick=openReceipts;
  el('mProjects').onclick=showWork;el('mReview').onclick=showReviews;el('mSessions').onclick=showSessions;el('mSearch').onclick=openCommand;
  el('layoutBtn').onclick=openLayout;
  document.addEventListener('click',e=>{const pm=e.target.closest('[data-projmanage]');if(pm){openProjectManage(pm.dataset.projmanage);return;}const p=e.target.closest('[data-project]');if(p)goProject(p.dataset.project);const t=e.target.closest('[data-tab]');if(t){if(t.dataset.tab==='project'&&state.view==='reviews')showWork();else switchTab(t.dataset.tab);}const c=e.target.closest('[data-close-tab]');if(c){delete chatDrafts[c.dataset.closeTab];state.tabs=state.tabs.filter(x=>x.id!==c.dataset.closeTab);switchTab('project');}});
  document.addEventListener('keydown',e=>{
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();if(!document.querySelector('dialog:modal'))openCommand();}
    if(e.key==='Escape'&&!document.querySelector('dialog:modal')){hideSelAsk();hideAnnComposer();if(store.layout.panes.length)closePane(store.layout.panes[store.layout.panes.length-1]);else{el('sidebar').classList.remove('open');el('hamburger').setAttribute('aria-expanded','false');}}
    if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)&&!e.ctrlKey&&!e.metaKey&&!document.querySelector('dialog:modal')){e.preventDefault();(state.tab==='project'?el('taskSearch'):el('chatInput'))?.focus();}
  });
  // W4b: selection "Ask about selection" affordance (transcript messages + doc excerpts).
  document.addEventListener('selectionchange',updateSelAsk);
  document.addEventListener('mousedown',e=>{const box=el('selAsk');if(box&&box.classList.contains('open')&&!box.contains(e.target))hideSelAsk();const comp=el('annComposer');if(comp&&comp.classList.contains('open')&&!comp.contains(e.target))hideAnnComposer();});
  window.addEventListener('scroll',hideSelAsk,true);
}
bindStatic();render();
})();
</script>
