<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Paseo project-first UI prototype — inline native launch. All actions simulated, no external services."
    />
    <title>Paseo — Project-first workspace</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11141c;
        --base: #141822;
        --sidebar: #0d1018;
        --header: #11151f;
        --surface: #1a1f2b;
        --surface2: #202637;
        --surface3: #283248;
        --line: #2b3243;
        --lineSoft: #222938;
        --text: #edf0f7;
        --secondary: #b7c0d1;
        --muted: #8995aa;
        --faint: #718098;
        --blue: #93aff0;
        --blueBright: #b8cbff;
        --blueFill: #263853;
        --warm: #e7ad77;
        --warmFill: #382c27;
        --red: #ed9b96;
        --redFill: #37282e;
        --positive: #9cc9c1;
        --positiveFill: #243b3a;
        --side: 272px;
        --inspector: 438px;
        /* One content measure for every page (slice S1). Breakpoints change these
           tokens; they never set a per-page max-width again. */
        --content: 1620px;
        --gutter: 112px;
        --measure: 880px;
        --head: 46px;
        --radius: 9px;
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-feature-settings: "tnum";
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      [role="button"]:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      svg {
        display: block;
      }
      button svg {
        flex-shrink: 0;
      }
      .app {
        height: 100%;
        display: flex;
        overflow: hidden;
      }
      #app {
        width: 100%;
      }
      .icon {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 1.75;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon.sm {
        width: 14px;
        height: 14px;
      }
      .icon.xs {
        width: 12px;
        height: 12px;
      }
      .icon.lg {
        width: 21px;
        height: 21px;
      }
      .dim {
        color: var(--muted);
      }
      .muted {
        color: var(--secondary);
      }
      .micro {
        font-size: 11px;
      }
      .small {
        font-size: 12px;
      }
      .label {
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
      }
      .eyebrow {
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: #9caecc;
        font-size: 11px;
        font-weight: 700;
      }
      .visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0);
      }
      .sidebar {
        width: var(--side);
        background: var(--sidebar);
        border-right: 1px solid var(--lineSoft);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-height: 0;
        z-index: 8;
      }
      .brandbar {
        height: var(--head);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 17px;
        border-bottom: 1px solid var(--lineSoft);
        flex-shrink: 0;
      }
      .mark {
        width: 22px;
        height: 22px;
        background: #e0e7f7;
        color: #151b28;
        font-weight: 900;
        border-radius: 5px;
        display: grid;
        place-items: center;
        font-size: 14px;
        letter-spacing: -0.07em;
      }
      .brand {
        font-weight: 750;
        letter-spacing: -0.03em;
        font-size: 15px;
      }
      .sidebar-scroll {
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 0;
        flex: 1;
        padding: 15px 10px 10px;
        scrollbar-width: thin;
        scrollbar-color: #343b4d transparent;
      }
      .nav-group {
        display: grid;
        gap: 3px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px 12px;
        min-height: 39px;
        color: var(--secondary);
        border-radius: 7px;
        font-size: 13px;
      }
      .nav-item:hover,
      .project-row:hover,
      .standalone-row:hover {
        background: #1a2130;
      }
      .nav-item.active {
        background: #242e42;
        color: #f2f5fa;
      }
      .nav-item .nav-count {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        color: var(--warm);
      }
      .sidebar-rule {
        height: 1px;
        background: var(--lineSoft);
        margin: 16px 4px 17px;
      }
      .side-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 0 9px 10px;
      }
      .side-section-title .label {
        color: #8f9cb0;
      }
      .side-section-title button {
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        border-radius: 4px;
        font-size: 11px;
      }
      .side-section-title button:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .focus-project {
        position: relative;
        background: #1a2332;
        border: 1px solid #3b4c68;
        border-radius: 8px;
        margin: 0 3px 20px;
        overflow: hidden;
      }
      .focus-label svg {
        color: var(--blue);
      }
      .focus-head {
        padding: 12px 13px 8px 13px;
      }
      .focus-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #a8b7d2;
        font-size: 10px;
        letter-spacing: 0.12em;
        font-weight: 750;
        text-transform: uppercase;
        margin-bottom: 9px;
      }
      .focus-row {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .project-icon {
        width: 26px;
        height: 26px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #39313c;
        color: #e4bc88;
        flex: 0 0 auto;
        font-weight: 750;
        font-size: 12px;
      }
      .project-icon.shiori {
        background: #31304a;
        color: #bdb0ff;
      }
      .project-icon.paseo {
        background: #303548;
        color: #a4bff2;
      }
      .project-icon.food-core {
        background: #263c45;
        color: #9dced6;
      }
      .project-icon.infrastructure {
        background: #293642;
        color: #b5c4d2;
      }
      .project-icon.crux {
        background: #3c3042;
        color: #dfaed4;
      }
      .project-icon.pivolution {
        background: #332d41;
        color: #d4b1ee;
      }
      .project-icon.quicklog {
        background: #343e39;
        color: #b8cec0;
      }
      .project-icon.home-core {
        background: #393b2e;
        color: #d2ce94;
      }
      .focus-name {
        font-size: 16px;
        font-weight: 780;
        letter-spacing: -0.025em;
      }
      .focus-sub {
        color: #aab6c9;
        font-size: 12px;
        margin: 5px 0 0;
      }
      .focus-alert {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        background: #262a35;
        border-top: 1px solid #394153;
        padding: 10px 10px 10px 15px;
        color: #e5e9f1;
        font-size: 12px;
        width: 100%;
      }
      .focus-alert:hover {
        background: #313748;
      }
      .focus-alert strong {
        font-weight: 650;
      }
      .focus-workspace {
        border-top: 1px solid #343e51;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 14px;
        color: #a8b8d3;
        font-size: 12px;
      }
      .focus-workspace button {
        font-size: 12px;
        padding: 0;
        color: inherit;
        flex: 1;
      }
      .focus-workspace button:hover {
        color: var(--text);
      }
      .project-section {
        margin-bottom: 13px;
      }
      .project-row {
        border-radius: 7px;
        width: 100%;
        padding: 9px 7px 9px 9px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 57px;
        color: var(--text);
      }
      .project-content {
        min-width: 0;
        flex: 1;
      }
      .project-row-head {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .project-row-sub {
        font-size: 11.5px;
        color: #9eacc1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .project-row.trailing {
        align-items: center;
      }
      .project-actions {
        display: flex;
        align-items: center;
        gap: 0;
      }
      .bare-icon {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        color: #8a97ac;
        border-radius: 4px;
      }
      .bare-icon:hover {
        background: #354059;
        color: var(--text);
      }
      .project-children {
        margin: 1px 0 5px 45px;
        border-left: 1px solid #344156;
        padding-left: 12px;
        display: grid;
        gap: 3px;
      }
      .project-children button {
        font-size: 11.5px;
        color: #9fadc2;
        padding: 6px 0 6px 8px;
        margin-left: -10px;
      }
      .project-children button:hover {
        color: var(--text);
        background: #202735;
        border-radius: 4px;
      }
      .passive-list {
        display: grid;
        gap: 1px;
      }
      .passive-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 5px;
        width: 100%;
        color: #a9b2c3;
        font-size: 12.5px;
      }
      .passive-row:hover {
        background: #202735;
        color: var(--text);
      }
      .passive-row .project-icon {
        width: 20px;
        height: 20px;
        font-size: 10px;
      }
      .passive-row .idle {
        margin-left: auto;
        font-size: 10px;
        color: #78869c;
      }
      .side-search {
        margin: 10px 5px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1b2130;
        border: 1px solid #31394b;
        border-radius: 6px;
        padding: 8px;
        color: #a2afc6;
      }
      .side-search input {
        width: 100%;
        outline: 0;
        background: transparent;
        border: 0;
        font-size: 12px;
      }
      .sidebar-bottom {
        padding: 13px 13px 10px;
        border-top: 1px solid var(--line);
        flex-shrink: 0;
        background: #10141e;
      }
      .usage-line {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #a3afc4;
        padding: 0 0 6px;
      }
      .usage-track {
        height: 3px;
        background: #343e51;
        margin-bottom: 12px;
        overflow: hidden;
        border-radius: 4px;
      }
      .usage-track span {
        height: 100%;
        display: block;
        background: #8ba5e1;
        border-radius: 4px;
      }
      .foot-actions {
        display: flex;
        justify-content: space-between;
      }
      .foot-actions button {
        color: #a6b3c9;
        padding: 6px;
        border-radius: 5px;
      }
      .foot-actions button:hover {
        color: white;
        background: #262f40;
      }
      .app-main {
        min-width: 0;
        min-height: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        height: var(--head);
        background: var(--header);
        border-bottom: 1px solid var(--lineSoft);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        flex-shrink: 0;
      }
      .topbar-crumb {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #b7c1d5;
        font-size: 12px;
        min-width: 0;
      }
      .topbar-crumb strong {
        color: #e2e8f3;
      }
      .crumb-sep {
        color: #657188;
      }
      .topbar-spacer {
        flex: 1;
      }
      .topbar button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .top-icon {
        color: #b7c2d6;
        width: 30px;
        height: 29px;
        border-radius: 5px;
      }
      .top-icon:hover {
        background: #252d40;
      }
      .mock-marker {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #a9b5c8;
        border: 1px solid #424a5a;
        border-radius: 4px;
        padding: 5px 7px;
      }
      .topbar .mobile-menu {
        display: none;
      }
      .workspace-tabs {
        height: 43px;
        border-bottom: 1px solid var(--lineSoft);
        display: flex;
        gap: 2px;
        align-items: end;
        padding: 0 16px;
        flex-shrink: 0;
        min-width: 0;
        overflow-x: auto;
      }
      .w-tab {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 13px 11px;
        min-height: 34px;
        color: #a7b4c9;
        font-size: 12px;
        border-radius: 6px 6px 0 0;
        border: 1px solid transparent;
        border-bottom: 0;
        white-space: nowrap;
      }
      .w-tab.active {
        background: #1e2636;
        border-color: #303c52;
        color: #f3f6fd;
      }
      .w-tab:hover {
        background: #1b2230;
      }
      .w-tab .close {
        font-size: 15px;
        color: #8d9cb3;
        margin-left: 6px;
      }
      .w-tab .close:hover {
        color: #fff;
      }
      .work-body {
        display: flex;
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .view {
        overflow: auto;
        min-width: 0;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: #37425a transparent;
      }
      .screen {
        width: min(calc(100% - var(--gutter)), var(--content));
        margin: 0 auto;
        padding: 40px 0 70px;
      }
      .pagehead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
        margin-bottom: 26px;
      }
      .pagehead h1 {
        font-size: 31px;
        font-weight: 750;
        line-height: 1.18;
        letter-spacing: -0.045em;
        margin: 9px 0 7px;
      }
      .pagehead p {
        color: var(--secondary);
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
      }
      .pagehead .left {
        min-width: 0;
      }
      .pagehead .buttons {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 6px;
        background: #222a3a;
        border: 1px solid #3c485e;
        color: #e6eaf3;
        min-height: 36px;
        padding: 8px 13px;
        font-size: 12.5px;
        font-weight: 650;
        white-space: nowrap;
      }
      .btn:hover {
        background: #303a50;
        border-color: #536487;
      }
      .btn.primary {
        background: #536fa9;
        border-color: #6484c4;
        color: white;
      }
      .btn.primary:hover {
        background: #637fc0;
      }
      .btn.quiet {
        background: transparent;
        border-color: var(--line);
        color: #b7c3d8;
      }
      .btn.warning {
        border-color: #866248;
        background: #403028;
        color: #f2bd90;
      }
      .btn.danger {
        background: #3b2930;
        border-color: #8d545c;
        color: #f1afb4;
      }
      .btn.small {
        padding: 5px 10px;
        min-height: 28px;
        font-size: 11.5px;
      }
      .btn:disabled {
        pointer-events: none;
      }
      .tabs {
        display: flex;
        gap: 23px;
        border-bottom: 1px solid #303749;
      }
      .tabs button {
        font-size: 13.5px;
        font-weight: 600;
        color: #9caac0;
        padding: 13px 2px 13px;
        border-bottom: 2px solid transparent;
      }
      .tabs button.active {
        color: #edf2fb;
        border-color: #a7c0f8;
      }
      .tabs button:hover {
        color: #fff;
      }
      .tab-count {
        font-size: 10px;
        border-radius: 9px;
        padding: 2px 6px;
        margin-left: 5px;
        background: #343246;
        color: #e6bd94;
      }
      .headline {
        font-size: 28px;
        letter-spacing: -0.035em;
        font-weight: 740;
        line-height: 1.23;
        margin: 0 0 10px;
      }
      .section-title {
        font-size: 18px;
        line-height: 1.3;
        margin: 0;
        letter-spacing: -0.015em;
        font-weight: 700;
      }
      .section-caption {
        font-size: 13px;
        line-height: 1.55;
        color: var(--secondary);
        margin-top: 6px;
      }
      .section-label {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
      }
      .section-label:after {
        content: "";
        background: var(--line);
        height: 1px;
        flex: 1;
      }
      .section-label h2 {
        font-size: 13px;
        font-weight: 740;
        letter-spacing: 0.02em;
        margin: 0;
      }
      .section-label small {
        font-size: 11px;
        color: var(--muted);
      }
      .tiny-tag {
        font-size: 10px;
        letter-spacing: 0.045em;
        padding: 4px 7px;
        border: 1px solid #3b4860;
        border-radius: 4px;
        color: #b9c6dd;
        text-transform: uppercase;
        font-weight: 700;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 720;
        padding: 4px 7px;
        border-radius: 4px;
        background: #273143;
        color: #c1cee4;
        white-space: nowrap;
      }
      .status:before {
        content: "";
        width: 5px;
        height: 5px;
        background: currentColor;
        border-radius: 100%;
      }
      .status.needs_review {
        background: #46382d;
        color: #f2bd88;
      }
      .status.blocked {
        background: #3b3038;
        color: #eeb1a8;
      }
      .status.running {
        background: #283c60;
        color: #a9c8ff;
      }
      .status.done {
        background: #2a3b3d;
        color: #b6d8d1;
      }
      .status.ready {
        background: #273f49;
        color: #a5d2d3;
      }
      .status.planned {
        background: #343341;
        color: #c7c2d5;
      }
      .status.idle {
        background: #29303e;
        color: #acb5c8;
      }
      .status.stopping {
        background: #3d3550;
        color: #d5c4ef;
      }
      .status.stopped {
        background: #2b2f3a;
        color: #9ba5b7;
      }
      .status.paused {
        background: #2f3a44;
        color: #a7c6d9;
      }
      .projecthero {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(340px, 0.72fr);
        gap: 20px;
        padding: 26px 28px;
        border: 1px solid #364259;
        border-radius: 9px;
        background: linear-gradient(120deg, #222d40 0%, #1b2434 44%, #1a202c 100%);
        margin: 28px 0;
      }
      .projecthero .eyebrow {
        color: #bccbe2;
      }
      .projecthero h2 {
        font-weight: 780;
        letter-spacing: -0.037em;
        font-size: 30px;
        line-height: 1.2;
        margin: 11px 0 12px;
        max-width: 760px;
      }
      .projecthero p {
        color: #b8c5d9;
        font-size: 14px;
        max-width: 690px;
        line-height: 1.6;
        margin: 0;
      }
      .hero-meta {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .hero-meta span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: #bcc9df;
      }
      .hero-action {
        background: #171e2a;
        border: 1px solid #45536a;
        border-left: 3px solid var(--warm);
        padding: 16px 17px;
        border-radius: 5px;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 15px;

      .diagram-svg {
        width: 100%;

      .diagram-svg .edge {

        stroke-width: 1.5;

        stroke-linejoin: round;

      .diagram-svg .edge.focal {

      }
      .diagram-svg .edge.blocked {
        stroke: #b99a84;

      }
      .diagram-svg .node rect {
        fill: #1c2433;
        stroke: #45536d;
        stroke-width: 1;
      }
      .diagram-svg .node.active rect {
        fill: #2b3d5b;
        stroke: #9cb8f0;
        stroke-width: 1.7;
      }
      .diagram-svg .node.blocked rect {
        fill: #272530;
        stroke: #725964;
      }
      .diagram-svg .node.done rect {

        stroke: #537875;
      }
      .diagram-svg .node:hover rect {

        stroke: #b7c7e5;
      }
      .diagram-svg .node {

      /* Compact execution hierarchy for the Runs page. The full tree is drawn once, in the

         is too narrow for every agent chip. */
      .exec-summary {

        padding: 3px 0 5px;

      }
      .exec-branch {
        display: flex;
        align-items: center;

      }
      .exec-helpers {

        align-items: center;
        gap: 8px;

        flex-wrap: nowrap;
      }
      @media (max-width: 720px) {

          gap: 8px;

        }
        .exec-meta {
          display: none;
        }
      }
      .diagram-lenses {
        display: inline-flex;

      .diagram-lenses button {

      }
      .diagram-lenses button:last-child {
        border-right: 0;
      }
      .diagram-lenses button.active {
        background: #394b70;
        color: #fff;
      }
      .plan-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 29px;
      }
      .plan-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 30px;
        margin-top: 20px;
      }
      /* The slice detail page sits under the Plan tab, so it says where it came from. */
      .slice-top {
        display: flex;
        align-items: center;
        gap: 14px;
        flex-wrap: wrap;
        margin: 22px 0 18px;
      }
      .slice-top .crumb {

      }
      .task-list {

      .task-row {
        width: 100%;
        padding: 13px 13px;

        gap: 13px;
        align-items: center;

      }
      .task-row:hover,
      .task-row.active {

      }
      .task-index {

      }
      .task-desc {

      }
      .task-desc strong {
        display: block;
        font-size: 13px;
      }
      .task-desc span {
        display: block;
        color: #a2b1c5;
        font-size: 11.5px;
        margin-top: 5px;
      }
      .task-reorder {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .task-reorder button {
        font-size: 13px;
        color: #a6b5ca;
        padding: 3px 7px;
      }
      .task-reorder button:hover {
        color: white;

      }
      .aside-panel {
        background: #171c27;

      .aside-panel p {

      .thumb-ui .windowbar {

      .thumb-ui .bar {
        margin-top: 9px;
        height: 7px;
        border-radius: 3px;

      .thumb-ui .bar.short {

      .mini-stats {

        border-left: 2px solid #879bc1;

      }
      .mini-stats strong {
        display: block;

      }
      .mini-stats span {
        font-size: 11px;

      .workspace-layout {

        min-height: 0;

      .agent-pane {
        min-width: 0;
        flex: 1.12;

      .dev-pane {

      .pane-top {
        height: 48px;
        border-bottom: 1px solid var(--lineSoft);

        gap: 12px;

      .pane-top strong {

        font-weight: 700;

      .pane-top .pane-actions {

      .pane-top .btn {

      .session-inner {
        overflow-y: auto;
        min-height: 0;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: #354057 transparent;
      }
      /* Turn rail (slice S8). The rail people struggle with today is a thin strip you have
         to hover to see. This one is always visible: a 24px row per turn, an 8px wide mark,
         a readable card on hover or keyboard focus, and the turn you are reading marked. */
      .turn-rail {
        position: sticky;
        top: 12px;
        float: right;
        z-index: 6;
        width: 34px;
        margin: 0 6px 0 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .turn-rail-label {
        writing-mode: vertical-rl;
        rotate: 180deg;
        align-self: center;
        padding: 0 0 4px;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7f8ea6;
      }
      .turn-marker {
        width: 34px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border-radius: 4px;
        color: #a9b8ce;
        font-size: 11px;
        font-weight: 700;
      }
      .turn-marker:hover,
      .turn-marker:focus-visible {
        background: #2a3446;
      }
      .turn-marker-bar {
        width: 8px;
        height: 12px;
        border-radius: 2px;
        background: #4b5a73;
      }
      .turn-marker.active .turn-marker-bar {
        width: 10px;
        height: 18px;
        background: #9ab5eb;
      }
      .turn-marker-no {
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
      }
      /* Anchored to the rail rather than the marker, so the card is never clipped at the
         top or bottom of the conversation. */
      .turn-preview {
        position: absolute;
        right: calc(100% + 10px);
        top: 0;
        width: 238px;
        display: grid;
        gap: 5px;
        padding: 10px 11px 11px;
        border: 1px solid #46536b;
        border-radius: 7px;
        background: #232b3b;
        box-shadow: 0 18px 50px #060914a8;
        color: #dbe5f5;
        font-size: 11.5px;
        line-height: 1.45;
        text-align: left;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        z-index: 20;
      }
      .turn-marker:hover .turn-preview,
      .turn-marker:focus-visible .turn-preview {
        opacity: 1;
        visibility: visible;
      }
      .turn-preview strong {
        font-size: 12.5px;
      }
      .turn-preview-prompt {
        color: #b7c6dd;
      }
      .turn-preview-row,
      .turn-produced-row {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px;
      }
      .turn-preview-row > span {
        color: #8fa0b8;
      }
      .session-inner:has(.turn-rail) > .session-content {
        padding-right: 56px;
      }
      .session-content {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 38px 28px 45px;
      }
      .session-content h1 {
        font-size: 26px;
        letter-spacing: -0.04em;
        margin: 0 0 7px;
      }
      .session-content .lead {
        font-size: 14px;
        color: #b0bfd4;
        line-height: 1.57;
        margin: 0 0 25px;
      }
      .session-overview {
        background: #1a2231;
        border: 1px solid #3c4a61;
        border-left: 3px solid #9ab5eb;
        border-radius: 6px;
        padding: 18px 18px 14px;
      }
      .session-overview h3 {
        font-size: 15px;
        margin: 6px 0;
      }
      .session-overview p {
        font-size: 12.5px;
        color: #b7c4d6;
        line-height: 1.55;
      }
      .session-toggles {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .session-toggles button {
        color: #a7b2c4;
        font-size: 11.5px;
        font-weight: 700;
        padding: 8px 10px;
        border-radius: 5px;
      }
      .session-toggles button.active {
        background: #354765;
        color: #fff;
      }
      .event {
        border-left: 1px solid #45516c;
        padding: 0 0 22px 19px;
        margin-left: 4px;
        position: relative;
      }
      .event:before {
        content: "";
        position: absolute;
        left: -4px;
        top: 3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9eb7e9;
      }
      .event h4 {
        margin: 0 0 5px;
        font-size: 14px;
      }
      .event p {
        font-size: 12.5px;
        color: var(--secondary);

        margin: 0;

      .message {
        background: #1c2230;
        border: 1px solid #303b50;

        padding: 16px;
        margin-bottom: 11px;
        font-size: 13px;
        color: #e1e5ee;
        line-height: 1.65;
      }
      .message.user {
        background: #283248;
        margin-left: 13%;
      }
      .message .who {
        font-size: 11px;
        color: #a1b3d2;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 6px;
      }
      .code-block {
        background: #111720;
        border: 1px solid #30394e;
        padding: 16px;
        border-radius: 6px;
        margin: 12px 0;
        font:
          12.5px/1.65 ui-monospace,
          Consolas,
          monospace;
        color: #c8d2e3;
        white-space: pre-wrap;
      }
      /* One turn of the conversation, rendered from the same list the rail marks. */
      .turn-block {
        border-top: 1px solid var(--lineSoft);
        margin-top: 20px;
        padding: 16px 0 2px;
      }
      .turn-block.current {
        border-left: 3px solid #9ab5eb;
        margin-left: -15px;
        padding-left: 12px;
      }
      .turn-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8fa0b8;
      }
      .turn-head .turn-no {
        color: #d3e0f6;
        font-weight: 700;
      }
      .turn-head .turn-elapsed {
        margin-left: auto;
        letter-spacing: 0;

      }
      .turn-produced {

        gap: 4px;
        margin: 12px 0 8px;
        font-size: 12px;
        color: #b7c4d6;
      }
      .turn-produced-row {
        grid-template-columns: 138px 1fr;
      }
      .turn-produced-row > span {
        color: #8fa0b8;
      }
      /* Slice S9: the reasoning behind a step, numbered 1 to 4, and the link from the
         reasoning to what it produced. Only one change has its reasoning worked out; every
         other step says so plainly instead of inventing one. */
      .thinking {
        margin: 12px 0 8px;
        border: 1px solid #33405a;
        border-radius: 7px;
        background: #171e2b;
      }
      .thinking-toggle {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        width: 100%;
        padding: 9px 12px;
        color: #cdd9ec;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .thinking-toggle:hover {
        background: #222c3e;
      }
      .thinking-steps {
        color: #7f8ea6;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: none;
      }
      .thinking.unavailable {
        margin: 12px 0 8px;
        padding: 9px 12px;
        border: 1px dashed #33405a;
        border-radius: 7px;
        background: #161c27;
        color: #8fa0b8;
        font-size: 12px;
      }
      .trace-steps {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .trace-step {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        padding: 11px 12px;
        border-top: 1px solid #2b3548;
      }
      .trace-step.marked {
        background: #24344c;
        outline: 1px solid #7ea6ee;
        outline-offset: -1px;
      }
      .trace-no {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #2c3a52;
        color: #cfe0fb;
        font-size: 11px;
        font-weight: 700;
      }
      .trace-label {
        display: block;
        color: #9fb2cc;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .trace-body p {
        margin: 4px 0 0;
        font-size: 12.5px;
        line-height: 1.55;
        color: #cdd7e6;

            if (!first) {
              e.preventDefault();
              dialog.focus();
            } else if (
              e.shiftKey &&
              (document.activeElement === first || document.activeElement === dialog)
            ) {
              e.preventDefault();
              last.focus();
            } else if (
              !e.shiftKey &&
              (document.activeElement === last || document.activeElement === dialog)
            ) {
              e.preventDefault();
              first.focus();
            }
          }
          const tab = e.target.closest("[role=tab]");
          if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
            const list = tab.closest("[role=tablist]");
            if (!list) return;
            const tabs = [...list.querySelectorAll("[role=tab]")],
              index = tabs.indexOf(tab),
              next =
                e.key === "Home"
                  ? 0
                  : e.key === "End"
                    ? tabs.length - 1
                    : (index + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
            e.preventDefault();
            const identity = focusIdentity(tabs[next]);
            tabs[next].click();
            findFocus(identity)?.focus();
          }
        });
        render();
        window.__PASEO_MOCK__ = { state: st, action, render, task, recalc };
      })();
    </script>
  </body>
</html>
