<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Paseo project-first UI prototype — native workspace with structured agent review reports. All actions simulated, no external services."
    />
    <title>Paseo — Project-first workspace</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #11141c;
        --base: #141822;
        --sidebar: #0d1018;
        --header: #11151f;
        --surface: #1a1f2b;
        --surface2: #202637;
        --surface3: #283248;
        --line: #2b3243;
        --lineSoft: #222938;
        --text: #edf0f7;
        --secondary: #b7c0d1;
        --muted: #8995aa;
        --faint: #718098;
        --blue: #93aff0;
        --blueBright: #b8cbff;
        --blueFill: #263853;
        --warm: #e7ad77;
        --warmFill: #382c27;
        --red: #ed9b96;
        --redFill: #37282e;
        --positive: #9cc9c1;
        --positiveFill: #243b3a;
        --side: 272px;
        --inspector: 438px;
        /* One content measure for every page (slice S1). Breakpoints change these
           tokens; they never set a per-page max-width again. */
        --content: 1620px;
        --gutter: 112px;
        --measure: 880px;
        --head: 46px;
        --radius: 9px;
        font-family:
          Inter,
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        font-size: 14px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-feature-settings: "tnum";
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      button:focus-visible,
      input:focus-visible,
      textarea:focus-visible,
      select:focus-visible,
      [role="button"]:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      svg {
        display: block;
      }
      button svg {
        flex-shrink: 0;
      }
      .app {
        height: 100%;
        display: flex;
        overflow: hidden;
      }
      #app {
        width: 100%;
      }
      .icon {
        width: 17px;
        height: 17px;
        stroke: currentColor;
        stroke-width: 1.75;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .icon.sm {
        width: 14px;
        height: 14px;
      }
      .icon.xs {
        width: 12px;
        height: 12px;
      }
      .icon.lg {
        width: 21px;
        height: 21px;
      }
      .dim {
        color: var(--muted);
      }
      .muted {
        color: var(--secondary);
      }
      .micro {
        font-size: 11px;
      }
      .small {
        font-size: 12px;
      }
      .label {
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 11px;
        font-weight: 700;
      }
      .eyebrow {
        letter-spacing: 0.11em;
        text-transform: uppercase;
        color: #9caecc;
        font-size: 11px;
        font-weight: 700;
      }
      .visually-hidden {
        position: absolute !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
        clip: rect(0, 0, 0, 0);
      }
      .sidebar {
        width: var(--side);
        background: var(--sidebar);
        border-right: 1px solid var(--lineSoft);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        min-height: 0;
        z-index: 8;
      }
      .brandbar {
        height: var(--head);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0 17px;
        border-bottom: 1px solid var(--lineSoft);
        flex-shrink: 0;
      }
      .mark {
        width: 22px;
        height: 22px;
        background: #e0e7f7;
        color: #151b28;
        font-weight: 900;
        border-radius: 5px;
        display: grid;
        place-items: center;
        font-size: 14px;
        letter-spacing: -0.07em;
      }
      .brand {
        font-weight: 750;
        letter-spacing: -0.03em;
        font-size: 15px;
      }
      .sidebar-scroll {
        overflow-y: auto;
        overflow-x: hidden;
        min-height: 0;
        flex: 1;
        padding: 15px 10px 10px;
        scrollbar-width: thin;
        scrollbar-color: #343b4d transparent;
      }
      .nav-group {
        display: grid;
        gap: 3px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 11px;
        width: 100%;
        padding: 10px 12px;
        min-height: 39px;
        color: var(--secondary);
        border-radius: 7px;
        font-size: 13px;
      }
      .nav-item:hover,
      .project-row:hover,
      .standalone-row:hover {
        background: #1a2130;
      }
      .nav-item.active {
        background: #242e42;
        color: #f2f5fa;
      }
      .nav-item .nav-count {
        margin-left: auto;
        font-size: 11px;
        font-weight: 600;
        color: var(--warm);
      }
      .sidebar-rule {
        height: 1px;
        background: var(--lineSoft);
        margin: 16px 4px 17px;
      }
      .side-section-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
        padding: 0 9px 10px;
      }
      .side-section-title .label {
        color: #8f9cb0;
      }
      .side-section-title button {
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 4px;
        border-radius: 4px;
        font-size: 11px;
      }
      .side-section-title button:hover {
        color: var(--text);
        background: var(--surface2);
      }
      .focus-project {
        position: relative;
        background: #1a2332;
        border: 1px solid #3b4c68;
        border-radius: 8px;
        margin: 0 3px 20px;
        overflow: hidden;
      }
      .focus-label svg {
        color: var(--blue);
      }
      .focus-head {
        padding: 12px 13px 8px 13px;
      }
      .focus-label {
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #a8b7d2;
        font-size: 10px;
        letter-spacing: 0.12em;
        font-weight: 750;
        text-transform: uppercase;
        margin-bottom: 9px;
      }
      .focus-row {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .project-icon {
        width: 26px;
        height: 26px;
        border-radius: 5px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: #39313c;
        color: #e4bc88;
        flex: 0 0 auto;
        font-weight: 750;
        font-size: 12px;
      }
      .project-icon.shiori {
        background: #31304a;
        color: #bdb0ff;
      }
      .project-icon.paseo {
        background: #303548;
        color: #a4bff2;
      }
      .project-icon.food-core {
        background: #263c45;
        color: #9dced6;
      }
      .project-icon.infrastructure {
        background: #293642;
        color: #b5c4d2;
      }
      .project-icon.crux {
        background: #3c3042;
        color: #dfaed4;
      }
      .project-icon.pivolution {
        background: #332d41;
        color: #d4b1ee;
      }
      .project-icon.quicklog {
        background: #343e39;
        color: #b8cec0;
      }
      .project-icon.home-core {
        background: #393b2e;
        color: #d2ce94;
      }
      .focus-name {
        font-size: 16px;
        font-weight: 780;
        letter-spacing: -0.025em;
      }
      .focus-sub {
        color: #aab6c9;
        font-size: 12px;
        margin: 5px 0 0;
      }
      .focus-alert {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        background: #262a35;
        border-top: 1px solid #394153;
        padding: 10px 10px 10px 15px;
        color: #e5e9f1;
        font-size: 12px;
        width: 100%;
      }
      .focus-alert:hover {
        background: #313748;
      }
      .focus-alert strong {
        font-weight: 650;
      }
      .focus-workspace {
        border-top: 1px solid #343e51;
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 10px 14px;
        color: #a8b8d3;
        font-size: 12px;
      }
      .focus-workspace button {
        font-size: 12px;
        padding: 0;
        color: inherit;
        flex: 1;
      }
      .focus-workspace button:hover {
        color: var(--text);
      }
      .project-section {
        margin-bottom: 13px;
      }
      .project-row {
        border-radius: 7px;
        width: 100%;
        padding: 9px 7px 9px 9px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        min-height: 57px;
        color: var(--text);
      }
      .project-content {
        min-width: 0;
        flex: 1;
      }
      .project-row-head {
        display: flex;
        gap: 6px;
        align-items: center;
        justify-content: space-between;
        font-size: 13px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .project-row-sub {
        font-size: 11.5px;
        color: #9eacc1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .project-row.trailing {
        align-items: center;
      }
      .project-actions {
        display: flex;
        align-items: center;
        gap: 0;
      }
      .bare-icon {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        color: #8a97ac;
        border-radius: 4px;
      }
      .bare-icon:hover {
        background: #354059;
        color: var(--text);
      }
      .project-children {
        margin: 1px 0 5px 45px;
        border-left: 1px solid #344156;
        padding-left: 12px;
        display: grid;
        gap: 3px;
      }
      .project-children button {
        font-size: 11.5px;
        color: #9fadc2;
        padding: 6px 0 6px 8px;
        margin-left: -10px;
      }
      .project-children button:hover {
        color: var(--text);
        background: #202735;
        border-radius: 4px;
      }
      .passive-list {
        display: grid;
        gap: 1px;
      }
      .passive-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 9px;
        border-radius: 5px;
        width: 100%;
        color: #a9b2c3;
        font-size: 12.5px;
      }
      .passive-row:hover {
        background: #202735;
        color: var(--text);
      }
      .passive-row .project-icon {
        width: 20px;
        height: 20px;
        font-size: 10px;
      }
      .passive-row .idle {
        margin-left: auto;
        font-size: 10px;
        color: #78869c;
      }
      .side-search {
        margin: 10px 5px;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #1b2130;
        border: 1px solid #31394b;
        border-radius: 6px;
        padding: 8px;
        color: #a2afc6;
      }
      .side-search input {
        width: 100%;
        outline: 0;
        background: transparent;
        border: 0;
        font-size: 12px;
      }
      .sidebar-bottom {
        padding: 13px 13px 10px;
        border-top: 1px solid var(--line);
        flex-shrink: 0;
        background: #10141e;
      }
      .usage-line {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #a3afc4;
        padding: 0 0 6px;
      }
      .usage-track {
        height: 3px;
        background: #343e51;
        margin-bottom: 12px;
        overflow: hidden;
        border-radius: 4px;
      }
      .usage-track span {
        height: 100%;
        display: block;
        background: #8ba5e1;
        border-radius: 4px;
      }
      .foot-actions {
        display: flex;
        justify-content: space-between;
      }
      .foot-actions button {
        color: #a6b3c9;
        padding: 6px;
        border-radius: 5px;
      }
      .foot-actions button:hover {
        color: white;
        background: #262f40;
      }
      .app-main {
        min-width: 0;
        min-height: 0;
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        height: var(--head);
        background: var(--header);
        border-bottom: 1px solid var(--lineSoft);
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        flex-shrink: 0;
      }
      .topbar-crumb {
        display: flex;
        align-items: center;
        gap: 9px;
        color: #b7c1d5;
        font-size: 12px;
        min-width: 0;
      }
      .topbar-crumb strong {
        color: #e2e8f3;
      }
      .crumb-sep {
        color: #657188;
      }
      .topbar-spacer {
        flex: 1;
      }
      .topbar button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
      }
      .top-icon {
        color: #b7c2d6;
        width: 30px;
        height: 29px;
        border-radius: 5px;
      }
      .top-icon:hover {
        background: #252d40;
      }
      .mock-marker {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #a9b5c8;
        border: 1px solid #424a5a;
        border-radius: 4px;
        padding: 5px 7px;
      }
      .topbar .mobile-menu {
        display: none;
      }
      .workspace-tabs {
        height: 43px;
        border-bottom: 1px solid var(--lineSoft);
        display: flex;
        gap: 2px;
        align-items: end;
        padding: 0 16px;
        flex-shrink: 0;
        min-width: 0;
        overflow-x: auto;
      }
      .w-tab {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 10px 13px 11px;
        min-height: 34px;
        color: #a7b4c9;
        font-size: 12px;
        border-radius: 6px 6px 0 0;
        border: 1px solid transparent;
        border-bottom: 0;
        white-space: nowrap;
      }
      .w-tab.active {
        background: #1e2636;
        border-color: #303c52;
        color: #f3f6fd;
      }
      .w-tab:hover {
        background: #1b2230;
      }
      .w-tab .close {
        font-size: 15px;
        color: #8d9cb3;
        margin-left: 6px;
      }
      .w-tab .close:hover {
        color: #fff;
      }
      .work-body {
        display: flex;
        flex: 1;
        min-height: 0;
        position: relative;
      }
      .view {
        overflow: auto;
        min-width: 0;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: #37425a transparent;
      }
      .screen {
        width: min(calc(100% - var(--gutter)), var(--content));
        margin: 0 auto;
        padding: 40px 0 70px;
      }
      .pagehead {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 22px;
        margin-bottom: 26px;
      }
      .pagehead h1 {
        font-size: 31px;
        font-weight: 750;
        line-height: 1.18;
        letter-spacing: -0.045em;
        margin: 9px 0 7px;
      }
      .pagehead p {
        color: var(--secondary);
        font-size: 14px;
        line-height: 1.5;
        margin: 0;
      }
      .pagehead .left {
        min-width: 0;
      }
      .pagehead .buttons {
        display: flex;
        gap: 9px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        border-radius: 6px;
        background: #222a3a;
        border: 1px solid #3c485e;
        color: #e6eaf3;
        min-height: 36px;
        padding: 8px 13px;
        font-size: 12.5px;
        font-weight: 650;
        white-space: nowrap;
      }
      .btn:hover {
        background: #303a50;
        border-color: #536487;
      }
      .btn.primary {
        background: #536fa9;
        border-color: #6484c4;
        color: white;
      }
      .btn.primary:hover {
        background: #637fc0;
      }
      .btn.quiet {
        background: transparent;
        border-color: var(--line);
        color: #b7c3d8;
      }
      .btn.warning {
        border-color: #866248;
        background: #403028;
        color: #f2bd90;
      }
      .btn.danger {
        background: #3b2930;
        border-color: #8d545c;
        color: #f1afb4;
      }
      .btn.small {
        padding: 5px 10px;
        min-height: 28px;
        font-size: 11.5px;
      }
      .btn:disabled {
        pointer-events: none;
      }
      .tabs {
        display: flex;
        gap: 23px;
        border-bottom: 1px solid #303749;
      }
      .tabs button {
        font-size: 13.5px;
        font-weight: 600;
        color: #9caac0;
        padding: 13px 2px 13px;
        border-bottom: 2px solid transparent;
      }
      .tabs button.active {
        color: #edf2fb;
        border-color: #a7c0f8;
      }
      .tabs button:hover {
        color: #fff;
      }
      .tab-count {
        font-size: 10px;
        border-radius: 9px;
        padding: 2px 6px;
        margin-left: 5px;
        background: #343246;
        color: #e6bd94;
      }
      .headline {
        font-size: 28px;
        letter-spacing: -0.035em;
        font-weight: 740;
        line-height: 1.23;
        margin: 0 0 10px;
      }
      .section-title {
        font-size: 18px;
        line-height: 1.3;
        margin: 0;
        letter-spacing: -0.015em;
        font-weight: 700;
      }
      .section-caption {
        font-size: 13px;
        line-height: 1.55;
        color: var(--secondary);
        margin-top: 6px;
      }
      .section-label {
        display: flex;
        align-items: center;
        gap: 9px;
        margin-bottom: 14px;
      }
      .section-label:after {
        content: "";
        background: var(--line);
        height: 1px;
        flex: 1;
      }
      .section-label h2 {
        font-size: 13px;
        font-weight: 740;
        letter-spacing: 0.02em;
        margin: 0;
      }
      .section-label small {
        font-size: 11px;
        color: var(--muted);
      }
      .tiny-tag {
        font-size: 10px;
        letter-spacing: 0.045em;
        padding: 4px 7px;
        border: 1px solid #3b4860;
        border-radius: 4px;
        color: #b9c6dd;
        text-transform: uppercase;
        font-weight: 700;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 720;
        padding: 4px 7px;
        border-radius: 4px;
        background: #273143;
        color: #c1cee4;
        white-space: nowrap;
      }
      .status:before {
        content: "";
        width: 5px;
        height: 5px;
        background: currentColor;
        border-radius: 100%;
      }
      .status.needs_review {
        background: #46382d;
        color: #f2bd88;
      }
      .status.blocked {
        background: #3b3038;
        color: #eeb1a8;
      }
      .status.running {
        background: #283c60;
        color: #a9c8ff;
      }
      .status.done {
        background: #2a3b3d;
        color: #b6d8d1;
      }
      .status.ready {
        background: #273f49;
        color: #a5d2d3;
      }
      .status.planned {
        background: #343341;
        color: #c7c2d5;
      }
      .status.idle {
        background: #29303e;
        color: #acb5c8;
      }
      .status.stopping {
        background: #3d3550;
        color: #d5c4ef;
      }
      .status.stopped {
        background: #2b2f3a;
        color: #9ba5b7;
      }
      .status.paused {
        background: #2f3a44;
        color: #a7c6d9;
      }
      .projecthero {
        display: grid;
        grid-template-columns: minmax(0, 1.5fr) minmax(340px, 0.72fr);
        gap: 20px;
        padding: 26px 28px;
        border: 1px solid #364259;
        border-radius: 9px;
        background: linear-gradient(120deg, #222d40 0%, #1b2434 44%, #1a202c 100%);
        margin: 28px 0;
      }
      .projecthero .eyebrow {
        color: #bccbe2;
      }
      .projecthero h2 {
        font-weight: 780;
        letter-spacing: -0.037em;
        font-size: 30px;
        line-height: 1.2;
        margin: 11px 0 12px;
        max-width: 760px;
      }
      .projecthero p {
        color: #b8c5d9;
        font-size: 14px;
        max-width: 690px;
        line-height: 1.6;
        margin: 0;
      }
      .hero-meta {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin-top: 24px;
      }
      .hero-meta span {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        font-size: 12px;
        color: #bcc9df;
      }
      .hero-action {
        background: #171e2a;
        border: 1px solid #45536a;
        border-left: 3px solid var(--warm);
        padding: 16px 17px;
        border-radius: 5px;
        align-self: stretch;
        display: flex;
        flex-direction: column;
        justify-content: space-between;

      .diagram-svg {

      .diagram-svg .edge {

        stroke-linejoin: round;

      .diagram-svg .edge.focal {

        stroke-width: 2;
      }
      .diagram-svg .edge.blocked {
        stroke: #b99a84;

      }
      .diagram-svg .node rect {
        fill: #1c2433;
        stroke: #45536d;
        stroke-width: 1;
      }
      .diagram-svg .node.active rect {
        fill: #2b3d5b;
        stroke: #9cb8f0;

      }
      .diagram-svg .node.blocked rect {

        stroke: #725964;
      }
      .diagram-svg .node.done rect {

      .diagram-svg .node:hover rect {

        stroke: #b7c7e5;
      }
      .diagram-svg .node {

      /* Compact execution hierarchy for the Runs page. The full tree is drawn once, in the
         inspector; this row stays on one line (~48px) and scrolls sideways when the column
         is too narrow for every agent chip. */
      .exec-summary {

        padding: 3px 0 5px;

        padding: 6px 11px 7px;

        border-radius: 6px;

      }
      .exec-branch {
        display: flex;

        color: #77849a;
      }
      .exec-helpers {

        align-items: center;
        gap: 8px;

        flex-wrap: nowrap;

      @media (max-width: 720px) {

          gap: 8px;

        }
        .exec-meta {
          display: none;
        }

      .diagram-lenses {

      .diagram-lenses button {

      }
      .diagram-lenses button:last-child {

      }
      .diagram-lenses button.active {

        color: #fff;
      }
      .plan-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-top: 29px;
      }
      .plan-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 330px;
        gap: 30px;
        margin-top: 20px;
      }
      /* The slice detail page sits under the Plan tab, so it says where it came from. */
      .slice-top {
        display: flex;

        gap: 14px;

        margin: 22px 0 18px;
      }
      .slice-top .crumb {

      .task-list {

      .task-row {

        padding: 13px 13px;

        align-items: center;

      }
      .task-row:hover,
      .task-row.active {

      .task-index {
        font-size: 11px;

      .task-desc {

      .task-desc strong {

        font-size: 13px;
      }
      .task-desc span {
        display: block;

        font-size: 11.5px;
        margin-top: 5px;
      }
      .task-reorder {
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .task-reorder button {
        font-size: 13px;
        color: #a6b5ca;
        padding: 3px 7px;
      }
      .task-reorder button:hover {
        color: white;
        background: #35415a;
      }
      .aside-panel {
        background: #171c27;
        border: 1px solid var(--line);

      .aside-panel h3 {

      .thumb-ui .windowbar {

        border-radius: 3px;

      .thumb-ui .bar.short {

      .mini-stats {

      .mini-stats strong {
        display: block;

      }
      .mini-stats span {

      .workspace-layout {

      .agent-pane {
        min-width: 0;
        flex: 1.12;

      .pane-top {
        height: 48px;
        border-bottom: 1px solid var(--lineSoft);

        gap: 12px;

      .pane-top strong {

        font-weight: 700;

      .pane-top .pane-actions {

      .pane-top .btn {

      .session-inner {
        overflow-y: auto;
        min-height: 0;
        flex: 1;
        scrollbar-width: thin;
        scrollbar-color: #354057 transparent;
      }
      /* Turn rail (slice S8). The rail people struggle with today is a thin strip you have
         to hover to see. This one is always visible: a 24px row per turn, an 8px wide mark,
         a readable card on hover or keyboard focus, and the turn you are reading marked. */
      .turn-rail {
        position: sticky;
        top: 12px;
        float: right;
        z-index: 6;
        width: 34px;
        margin: 0 6px 0 0;
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .turn-rail-label {
        writing-mode: vertical-rl;
        rotate: 180deg;
        align-self: center;
        padding: 0 0 4px;
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #7f8ea6;
      }
      .turn-marker {
        width: 34px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        border-radius: 4px;
        color: #a9b8ce;
        font-size: 11px;
        font-weight: 700;
      }
      .turn-marker:hover,
      .turn-marker:focus-visible {
        background: #2a3446;
      }
      .turn-marker-bar {
        width: 8px;
        height: 12px;
        border-radius: 2px;
        background: #4b5a73;
      }
      .turn-marker.active .turn-marker-bar {
        width: 10px;
        height: 18px;
        background: #9ab5eb;
      }
      .turn-marker-no {
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
      }
      /* Anchored to the rail rather than the marker, so the card is never clipped at the
         top or bottom of the conversation. */
      .turn-preview {
        position: absolute;
        right: calc(100% + 10px);
        top: 0;
        width: 238px;
        display: grid;
        gap: 5px;
        padding: 10px 11px 11px;
        border: 1px solid #46536b;
        border-radius: 7px;
        background: #232b3b;
        box-shadow: 0 18px 50px #060914a8;
        color: #dbe5f5;
        font-size: 11.5px;
        line-height: 1.45;
        text-align: left;
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        z-index: 20;
      }
      .turn-marker:hover .turn-preview,
      .turn-marker:focus-visible .turn-preview {
        opacity: 1;
        visibility: visible;
      }
      .turn-preview strong {
        font-size: 12.5px;
      }
      .turn-preview-prompt {
        color: #b7c6dd;
      }
      .turn-preview-row,
      .turn-produced-row {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 8px;
      }
      .turn-preview-row > span {
        color: #8fa0b8;
      }
      .session-inner:has(.turn-rail) > .session-content {
        padding-right: 56px;
      }
      .session-content {
        max-width: var(--measure);
        margin: 0 auto;
        padding: 38px 28px 45px;
      }
      .session-content h1 {
        font-size: 26px;
        letter-spacing: -0.04em;
        margin: 0 0 7px;
      }
      .session-content .lead {
        font-size: 14px;
        color: #b0bfd4;
        line-height: 1.57;
        margin: 0 0 25px;
      }
      .session-overview {
        background: #1a2231;
        border: 1px solid #3c4a61;
        border-left: 3px solid #9ab5eb;
        border-radius: 6px;
        padding: 18px 18px 14px;
      }
      .session-overview h3 {
        font-size: 15px;
        margin: 6px 0;
      }
      .session-overview p {
        font-size: 12.5px;
        color: #b7c4d6;
        line-height: 1.55;
      }
      .session-toggles {
        display: flex;
        align-items: center;
        gap: 3px;
      }
      .session-toggles button {
        color: #a7b2c4;
        font-size: 11.5px;
        font-weight: 700;
        padding: 8px 10px;
        border-radius: 5px;
      }
      .session-toggles button.active {
        background: #354765;
        color: #fff;
      }
      .event {
        border-left: 1px solid #45516c;
        padding: 0 0 22px 19px;
        margin-left: 4px;
        position: relative;
      }
      .event:before {
        content: "";
        position: absolute;
        left: -4px;
        top: 3px;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9eb7e9;
      }
      .event h4 {
        margin: 0 0 5px;
        font-size: 14px;

      .event p {
        font-size: 12.5px;
        color: var(--secondary);

      .message {
        background: #1c2230;
        border: 1px solid #303b50;

        color: #e1e5ee;
        line-height: 1.65;
      }
      .message.user {
        background: #283248;
        margin-left: 13%;
      }
      .message .who {
        font-size: 11px;
        color: #a1b3d2;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 6px;
      }
      .code-block {
        background: #111720;
        border: 1px solid #30394e;
        padding: 16px;
        border-radius: 6px;
        margin: 12px 0;
        font:
          12.5px/1.65 ui-monospace,
          Consolas,
          monospace;
        color: #c8d2e3;
        white-space: pre-wrap;
      }
      /* One turn of the conversation, rendered from the same list the rail marks. */
      .turn-block {
        border-top: 1px solid var(--lineSoft);
        margin-top: 20px;
        padding: 16px 0 2px;
      }
      .turn-block.current {
        border-left: 3px solid #9ab5eb;
        margin-left: -15px;
        padding-left: 12px;
      }
      .turn-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #8fa0b8;
      }
      .turn-head .turn-no {
        color: #d3e0f6;
        font-weight: 700;
      }
      .turn-head .turn-elapsed {
        margin-left: auto;
        letter-spacing: 0;

      }
      .turn-produced {

        margin: 12px 0 8px;
        font-size: 12px;
        color: #b7c4d6;
      }
      .turn-produced-row {
        grid-template-columns: 138px 1fr;
      }
      .turn-produced-row > span {
        color: #8fa0b8;

      /* Slice S9: the reasoning behind a step, numbered 1 to 4, and the link from the
         reasoning to what it produced. Only one change has its reasoning worked out; every
         other step says so plainly instead of inventing one. */
      .thinking {
        margin: 12px 0 8px;
        border: 1px solid #33405a;
        border-radius: 7px;
        background: #171e2b;
      }
      .thinking-toggle {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 10px;
        width: 100%;
        padding: 9px 12px;
        color: #cdd9ec;
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .thinking-toggle:hover {
        background: #222c3e;
      }
      .thinking-steps {
        color: #7f8ea6;
        font-size: 10px;
        letter-spacing: 0.04em;
        text-transform: none;
      }
      .thinking.unavailable {
        margin: 12px 0 8px;
        padding: 9px 12px;
        border: 1px dashed #33405a;
        border-radius: 7px;
        background: #161c27;
        color: #8fa0b8;
        font-size: 12px;
      }
      .trace-steps {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .trace-step {
        display: grid;
        grid-template-columns: 24px 1fr;
        gap: 10px;
        padding: 11px 12px;
        border-top: 1px solid #2b3548;
      }
      .trace-step.marked {
        background: #24344c;
        outline: 1px solid #7ea6ee;
        outline-offset: -1px;
      }
      .trace-no {
        width: 22px;
        height: 22px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: #2c3a52;
        color: #cfe0fb;
        font-size: 11px;
        font-weight: 700;
      }
      .trace-label {
        display: block;
        color: #9fb2cc;
        font-size: 10.5px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .trace-body p {
        margin: 4px 0 0;
        font-size: 12.5px;
        line-height: 1.55;

        flex-shrink: 0;
      }
      .side-count {
        padding: 4px 9px;
        border-radius: 999px;
        background: var(--blueFill);
        color: #cfe0fb;
        font-size: 11px;
      }
      .side-model {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-left: auto;
      }
      .side-model select {
        background: #222b3c;
        color: var(--text);
        border: 1px solid #3d4c64;
        border-radius: 5px;
        padding: 5px 6px;
        font-size: 11.5px;
        max-width: 190px;
      }
      .side-switch {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 11px 18px 0;
      }
      .side-switch button {
        font-size: 11px;
        padding: 5px 8px;
        border-radius: 5px;
        background: #222b3c;
        border: 1px solid #3d4c64;
        color: #b7c6de;
      }
      .side-drawer-body {
        overflow-y: auto;
        padding: 16px 18px;
        flex: 1;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: #37425a transparent;
      }
      .side-drawer-body .message {
        font-size: 12.5px;
        padding: 13px;
      }
      .side-drawer-body .message.user {
        margin-left: 8%;
      }
      .side-note {
        font-size: 11.5px;
        color: var(--secondary);
        margin: 0 0 12px;
      }
      .side-answer-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 2px 0 12px;
      }
      .side-answer-state {
        font-size: 11.5px;
        color: var(--positive);
        margin: 0 0 12px;
      }
      .side-drawer-foot {
        border-top: 1px solid var(--line);
        padding: 12px 18px 15px;
        flex-shrink: 0;
      }
      .side-drawer-foot textarea {
        width: 100%;
        min-height: 54px;
        resize: none;
        background: #1c2332;
        border: 1px solid #3c4961;
        border-radius: 7px;
        padding: 10px;
        color: var(--text);
        font-size: 12.5px;
        outline: 0;
      }
      .side-drawer-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      .side-chat-chips {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-top: 22px;
      }
      .side-chat-chip {
        display: flex;
        align-items: center;
        gap: 7px;
        text-align: left;
        border: 1px solid #465877;
        background: #212c40;
        color: #cddcf4;
        border-radius: 6px;
        padding: 9px 11px;
        font-size: 12px;
      }
      .side-chat-chip:hover {
        background: #2a374e;
      }
      .side-chat-new {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11.5px;
        padding: 6px 9px;
        border-radius: 6px;
        border: 1px solid #3b4557;
        color: #b7c1d5;
      }
      .side-chat-new:hover {
        background: #232c3c;
        color: #e6ecf7;
      }
      .side-chat-badge {
        min-width: 17px;
        padding: 1px 5px;
        border-radius: 999px;
        background: var(--blueFill);
        color: #cfe0fb;
        font-size: 10.5px;
      }
      /* Steer queue (slice S7): one instruction, where it is in delivery, what you can do. */
      .steer-queue {
        display: flex;
        flex-direction: column;
        gap: 9px;
        margin: 12px 0 14px;
      }
      .steer-item {
        border: 1px solid var(--line);
        border-left: 3px solid var(--muted);
        border-radius: 7px;
        padding: 10px 11px;
        background: var(--surface2);
      }
      .steer-head {
        display: flex;
        align-items: baseline;
        gap: 9px;
        flex-wrap: wrap;
        font-size: 11px;
        color: var(--muted);
      }
      .steer-head strong {
        font-size: 12.5px;
        color: var(--text);
      }
      .steer-text {
        margin: 7px 0 0;
        font-size: 12.5px;
        color: var(--text);
      }
      .steer-note {
        margin: 6px 0 0;
        font-size: 11.5px;
        color: var(--secondary);
      }
      .steer-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin-top: 9px;
      }
      .steer-draft {
        border-left-color: var(--muted);
      }
      .steer-queued {
        border-left-color: var(--warm);
      }
      .steer-delivered {
        border-left-color: var(--blue);
      }
      .steer-applied {
        border-left-color: var(--positive);
      }
      .steer-interrupt_required {
        border-left-color: var(--red);
      }
      .steer-unavailable {
        border-left-color: var(--faint);
      }
      .steer-cancelled {
        border-left-color: var(--line);
        opacity: 0.6;
      }
      /* The queue stays visible while you keep working: a strip above the composer. */
      .steer-strip {
        display: flex;
        align-items: center;
        gap: 7px;
        flex-wrap: wrap;
        padding: 9px 12px 0;
      }
      .steer-chip {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--surface2);
        color: var(--secondary);
        font-size: 11px;
        padding: 4px 10px;
      }
      button.steer-chip:hover {
        background: var(--surface3);
        color: var(--text);
      }
      .steer-chip.steer-queued {
        background: var(--warmFill);
      }
      .steer-chip.steer-delivered {
        background: var(--blueFill);
      }
      .steer-chip.steer-applied {
        background: var(--positiveFill);
      }
      .steer-chip.steer-interrupt_required {
        background: var(--redFill);
      }
      .steer-open {
        font-size: 11px;
        color: var(--blue);
        text-decoration: underline;
      }
      .steer-save-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .steer-count {
        margin: 12px 0 0;
        font-size: 11.5px;
        color: var(--secondary);
      }
      /* What the Activity view is actually showing right now. */
      .activity-visibility {
        display: flex;
        align-items: center;
        gap: 9px;
        flex-wrap: wrap;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface);
        padding: 10px 12px;
        margin: 0 0 18px;
        font-size: 12.5px;
        color: var(--secondary);
      }
      .activity-visibility.mid-edit {
        border-color: #4a3f2c;
        background: var(--warmFill);
      }
      .file-now {
        margin: 0 0 18px;
      }
      .file-now-head {
        display: flex;
        gap: 9px;
        align-items: baseline;
        flex-wrap: wrap;
        font-size: 12px;
        margin-bottom: 7px;
      }
      /* A change request is a review decision, not an instruction to a running agent. */
      .change-request {
        border: 1px solid var(--line);
        border-left: 3px solid var(--warm);
        border-radius: 7px;
        padding: 9px 11px;
        margin: 9px 0;
        font-size: 12px;
      }
      .change-request p {
        margin: 5px 0;
        color: var(--text);
      }
      /* A side chat answer saved to project knowledge lands here. */
      .knowledge-notes {
        margin: 12px 0;
      }
      .knowledge-notes .note-line + .note-line {
        margin-top: 10px;
      }
      /* Sequences (slice S11a): a sequence points at work that already exists, so its
         strip and step rows only say what you can do next. */
      .seq-strip {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface2);
        padding: 8px 11px;
        margin: 10px 0 0;
      }
      .seq-preview {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        padding: 14px 16px;
      }
      .seq-preview span {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--base);
        padding: 6px 9px;
      }
      .seq-actions {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        align-items: center;
      }
      .seq-block {
        border: 1px solid var(--line);
        border-left: 3px solid var(--warm);
        padding: 10px 12px;
        margin: 14px 0 0;
      }
      @media (max-width: 720px) {
        .side-drawer {
          width: 100%;
          border-left: 0;
        }
        .side-chat-new-label {
          display: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
      @media (forced-colors: active) {
        button,
        input,
        textarea,
        select,
        [role="separator"] {
          border: 1px solid ButtonText;
        }
        .status {
          border: 1px solid CanvasText;
        }
        .native-tab.selected,
        [aria-selected="true"] {
          outline: 2px solid Highlight;
        }
        .native-split-handle {
          background: ButtonText;
        }
      }
      @media (max-width: 720px) {
        .sheet {
          overflow-x: auto;
          overscroll-behavior-x: contain;
        }
        .simple-table td,

          padding: 11px 8px;
          font-size: 12px;
        }
      }

      .pn-primary {display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid #7894ca;background:#5b78b0;color:#fff;border-radius:7px;font-size:13px;font-weight:650;padding:10px 14px;min-height:39px;white-space:nowrap;}

      /* Toasts must not block workspace controls while feedback is visible. */

          } else if (e.key === "[" || e.key === "]") {
            // Previous / next turn in the conversation. Never steals the key from a field.
            if (st.modal || st.agentAttention.active || st.command || st.route !== "workspace") return;
            if (e.target.closest?.("input,textarea,select,[contenteditable=true]")) return;
            e.preventDefault();
            action(e.key === "[" ? "turnPrev" : "turnNext");
          } else if (e.key === "Escape") {
            if (st.batch.open) {e.preventDefault();action("batchClose");return;}
            if (st.modelPicker) {
              closeModelPicker(true);
              return;
            }
            if (st.command) {
              st.command = false;
              st.focusAfterRender = { action: "command" };
            } else if (st.createMenu) {
              st.createMenu = false;
              st.focusAfterRender = { action: "createMenu" };
            } else if (st.snippetMenu) {
              st.snippetMenu = false;
              st.focusAfterRender = { action: "snippetMenu" };
            } else if (st.paneMenu) {
              st.focusAfterRender = { action: "paneMenu:" + st.paneMenu };
              st.paneMenu = null;
            } else if (st.modal) st.modal = null;
            else if (st.agentAttention.active) {st.agentAttention.active=null;st.agentAttention.note="";}
            else if (st.sideChat) {
              st.sideChat = null;
              st.focusAfterRender = { action: "sideChatNew" };
            } else if (st.sidebarOpen) {
              st.sidebarOpen = false;
              st.focusAfterRender = { action: "mobile-menu" };
            } else if (st.inspector) {
              st.inspector = null;
              st.focusAfterRender = { action: "toggleInspector" };
            } else return;
            render();
          } else if (
            (e.key === "Enter" || e.key === " ") &&
            e.target.matches("svg [data-action]")
          ) {
            e.preventDefault();
            action(e.target.dataset.action);
          }
        });
        document.addEventListener("input", (e) => {
          const id = e.target.id;
          if (["workspace-name", "workspace-branch"].includes(id) && st.workspaceDraft)
            st.workspaceDraft[id.slice("workspace-".length)] = e.target.value;
          if (["schedule-name", "schedule-at", "schedule-every"].includes(id) && st.scheduleDraft) {
            const field = id.slice("schedule-".length);
            if (field === "name") st.scheduleDraft.name = e.target.value;
            else st.scheduleDraft.trigger[field] = e.target.value;
          }
          if (id.startsWith("batch-prompt-")) {
            const row = st.batch.prompts.find((p)=>p.id===Number(id.slice("batch-prompt-".length)));
            if (row) row.text = e.target.value;
          }
          if (id.startsWith("batch-title-")) {
            const row = st.batch.prompts.find((p)=>p.id===Number(id.slice("batch-title-".length)));
            if (row) row.title = e.target.value;
          }
          if (id.startsWith("batch-check-")) {
            const row = st.batch.prompts.find((p)=>p.id===Number(id.slice("batch-check-".length)));
            if (row) row.checks = e.target.value;
          }
          if (id === "snippet-name") st.snippetName = e.target.value;
          if (id === "terminal-command") {
            const t = currentTab();
            if (t?.terminal) t.terminal.commandDraft = e.target.value;
          }
          if (id === "model-query") {
            st.modelQuery = e.target.value;
            document.querySelector(".model-options").innerHTML = modelOptions(
              st.tabsById[st.modelPicker],
            );
            return;
          }
          if (id === "task-composer") st.taskCockpit.drafts[st.taskCockpit.activeSession] = e.target.value;
          if (id === "review-draft" || id === "annotation-draft") st.commentDraft = e.target.value;
          if (id === "side-chat-draft") st.sideChatDraft = e.target.value;
          if (id === "attention-note") st.agentAttention.note = e.target.value;
          if (id === "capture-draft" || id === "modal-draft") st.formDraft = e.target.value;
          if (id === "creation-prompt") st.creationPrompt = e.target.value;
          if (id.startsWith("composer-")) {
            const t = st.tabsById[id.replace("composer-", "")];
            if (t) t.draft = e.target.value;
          }
          if (id === "command-query") {
            let text = e.target.value;
            st.commandText = text;
            render();
            const n = document.getElementById("command-query");
            n?.setSelectionRange(text.length, text.length);
          }
        });
        document.addEventListener("change", (e) => {
          if (e.target.id === "workspace-switcher") {
            action("workspaceSwitch:" + e.target.value);
            return;
          }
          if (e.target.id === "workspace-host" && st.workspaceDraft) {
            st.workspaceDraft.host = e.target.value;
            return;
          }
          if (e.target.id === "schedule-parent") {
            action("scheduleField:parentRef:" + e.target.value);
            return;
          }
          if (e.target.id === "schedule-mode") {
            action("scheduleField:mode:" + e.target.value);
            return;
          }
          if (e.target.dataset.reasoningTab) {
            const t = st.tabsById[e.target.dataset.reasoningTab];
            t.reasoning = e.target.value;
            syncTab(t);
            return;
          }
          if (e.target.id === "batch-route") {
            st.batch.route = e.target.value;
            return;
          }
          if (e.target.id === "batch-start-after") {
            st.batch.startAfter = e.target.value;
            document.querySelectorAll("[data-batch-managed]").forEach((el) => { el.hidden = e.target.value !== "managed"; });
            return;
          }
          if (e.target.id === "batch-managed-session") {
            st.batch.managedSession = e.target.value;
            return;
          }
          if (e.target.id === "batch-unattended") {
            st.batch.unattended = e.target.checked;
            return;
          }
          if (e.target.id === "model-provider") {
            const t = st.tabsById[st.modelPicker];
            t.provider = e.target.value;
            t.model = providerModels[t.provider][0][0];
            st.modelQuery = "";
            syncTab(t);
            render();
            document.getElementById("model-provider")?.focus();
            return;
          }
          if (e.target.id === "side-chat-model") {
            // A side chat may use a different model than the main agent session.
            const c = sideChat(st.sideChat);
            if (c) c.model = e.target.value;
            render();
            document.getElementById("side-chat-model")?.focus();
            return;
          }
          let map = {
            "creation-project": "creationProject",
            "creation-host": "creationHost",
            "creation-provider": "creationProvider",
            "creation-model": "creationModel",
            "creation-reasoning": "creationReasoning",
            "terminal-host": "host",
            "terminal-shell": "shell",
            "terminal-cwd": "cwd",
            "tab-provider": "provider",
            "tab-model": "model",
            "tab-reasoning": "reasoning",
          };
          const id = e.target.id;
          let k = map[id];
          if (!k) return;
          if (id.startsWith("terminal-")) {
            const t = currentTab();
            if (t?.terminal) t.terminal[k] = e.target.value;
          } else if (id.startsWith("tab-")) {
            const t = currentTab();
            if (t) t[k] = e.target.value;
          } else {
            st[k] = e.target.value || null;
            if (id === "creation-provider") {
              const allowed = {
                Pi: ["Qwen 3.8 27B", "GPT-6"],
                Codex: ["GPT-6", "GPT-5.6"],
                "Claude Code": ["Claude"],
              }[st.creationProvider] || ["Qwen 3.8 27B"];
              if (!allowed.includes(st.creationModel)) st.creationModel = allowed[0];
            }
          }
          render();
          document.getElementById(id)?.focus();
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && e.target.id === "terminal-command") {
            e.preventDefault();
            action("terminalSend");
          } else if (e.key === "Enter" && !e.shiftKey && e.target.id === "side-chat-draft") {
            // Shift+Enter still makes a new line; Enter asks the question.
            e.preventDefault();
            action("sideAsk");
          }
        });
        document.addEventListener(
          "click",
          (e) => {
            if (
              st.createMenu &&
              !e.target.closest(".create-trigger-wrap") &&
              !e.target.closest('[data-action="createMenu"]')
            ) {
              st.createMenu = false;
              render();
            }
          },
          true,
        );
        document.addEventListener("dragstart", (e) => {
          const tab = e.target.closest("[data-tabdrag]");
          if (tab) {
            e.dataTransfer?.setData("application/x-paseo-tab", tab.dataset.tabdrag);
            e.dataTransfer.effectAllowed = "move";
            return;
          }
          const t = e.target.closest("[data-drag-project]");
          if (t) e.dataTransfer?.setData("text/plain", t.dataset.dragProject);
        });
        document.addEventListener("dragover", (e) => {
          if (e.target.closest("[data-drop-zone]") || e.target.closest("[data-paneldrop]"))
            e.preventDefault();
        });
        document.addEventListener("drop", (e) => {
          const target = e.target.closest("[data-paneldrop]");
          if (target) {
            const id = e.dataTransfer?.getData("application/x-paseo-tab");
            if (!id) return;
            e.preventDefault();
            const root = layoutFor(st.currentLayoutKey),
              from = leaves(root).find((x) => x.tabs.includes(id)),
              to = findLeaf(root, target.dataset.paneldrop);
            if (!from || !to || from.id === to.id) return;
            from.tabs = from.tabs.filter((x) => x !== id);
            if (from.selected === id) from.selected = from.tabs[0] || null;
            to.tabs.push(id);
            to.selected = id;
            st.focusPaneId = to.id;
            render();
            return;
          }
          const z = e.target.closest("[data-drop-zone]");
          if (!z) return;
          e.preventDefault();
          const id = e.dataTransfer?.getData("text/plain");
          if (!st.projects.some((p) => p.id === id) || id === st.focus) return;
          if (z.dataset.dropZone === "active") st.active = [...new Set([...st.active, id])];
          else st.active = st.active.filter((x) => x !== id);
          persist();
          toast(`${getProject(id).name} moved to ${z.dataset.dropZone} projects.`);
          render();
        });
        let resizing = null;
        function endResize() {
          const drag = resizing;
          resizing = null;
          if (!drag) return;
          persist();
          try {
            if (drag.handle.hasPointerCapture?.(drag.pointerId))
              drag.handle.releasePointerCapture(drag.pointerId);
          } catch {}
        }
        function applyRatio(container, model, ratio) {
          model.ratio = Math.max(0.2, Math.min(0.8, ratio));
          const path = splitPath(layoutFor(st.currentLayoutKey), model.id);
          if (path !== null) st.ratios[st.currentLayoutKey + ":" + path] = model.ratio;
          container.children[0].style.flex = model.ratio + " 1 0%";
          container.children[2].style.flex = 1 - model.ratio + " 1 0%";
          container
            .querySelector(":scope > [role=separator]")
            ?.setAttribute("aria-valuenow", Math.round(model.ratio * 100));
        }
        document.addEventListener("pointerdown", (e) => {
          const handle = e.target.closest("[data-split-id]");
          if (!handle || e.button !== 0) return;
          if (resizing) {
            if (!e.isPrimary) return;
            if (resizing.pointerId === e.pointerId) return;
            endResize();
          }
          const container = handle.parentElement,
            model = findSplit(layoutFor(st.currentLayoutKey), handle.dataset.splitId);
          if (!model) return;
          resizing = { container, model, handle, pointerId: e.pointerId };
          try {
            handle.setPointerCapture(e.pointerId);
          } catch {}
          e.preventDefault();
        });
        document.addEventListener("pointermove", (e) => {
          if (!resizing || e.pointerId !== resizing.pointerId) return;
          const { container, model } = resizing,
            rect = container.getBoundingClientRect(),
            size = model.axis === "horizontal" ? rect.width : rect.height;
          if (!size) return;
          applyRatio(
            container,
            model,
            (model.axis === "horizontal" ? e.clientX - rect.left : e.clientY - rect.top) / size,
          );
        });
        for (const type of ["pointerup", "pointercancel", "lostpointercapture"])
          document.addEventListener(type, (e) => {
            if (resizing?.pointerId === e.pointerId) endResize();
          });
        window.addEventListener("blur", endResize);
        // Scrolling the conversation marks the turn you are reading, so the rail and the
        // conversation stay in step. Element scroll events need the capture phase.
        document.addEventListener(
          "scroll",
          (e) => {
            const box = e.target;
            if (!box?.classList?.contains("session-inner")) return;
            const blocks = [...box.querySelectorAll(".turn-block")];
            if (!blocks.length) return;
            const edge = box.getBoundingClientRect().top + 26;
            let seen = 0;
            for (const b of blocks)
              if (b.getBoundingClientRect().top <= edge) seen = Number(b.dataset.turn);
            // The last turns cannot always be scrolled up to the edge; once you have reached
            // the end of the session, the end is what you are reading.
            if (box.scrollTop > 0 && box.scrollTop + box.clientHeight >= box.scrollHeight - 4)
              seen = Number(blocks.at(-1).dataset.turn);
            if (seen && seen !== st.turnRailActive) {
              st.turnRailActive = seen;
              render();
            }
          },
          true,
        );
        // Responsive rules (compact panes, off-canvas drawer) follow viewport changes, not just actions.
        window.addEventListener("resize", () => render());
        document.addEventListener("keydown", (e) => {
          const handle = e.target.closest("[data-split-id]");
          if (handle) {
            const model = findSplit(layoutFor(st.currentLayoutKey), handle.dataset.splitId),
              keys =
                model?.axis === "horizontal"
                  ? ["ArrowLeft", "ArrowRight"]
                  : ["ArrowUp", "ArrowDown"];
            if (model && [...keys, "Home", "End"].includes(e.key)) {
              e.preventDefault();
              applyRatio(
                handle.parentElement,
                model,
                e.key === "Home"
                  ? 0.2
                  : e.key === "End"
                    ? 0.8
                    : model.ratio + (e.key === keys[0] ? -0.05 : 0.05),
              );
              return;
            }
          }
          const dialog = document.querySelector(".overlay .dialog") || document.querySelector(".intake-drawer");
          if (dialog && e.key === "Tab") {
            const items = [
              ...dialog.querySelectorAll('button,input,textarea,select,[tabindex="0"]'),
            ].filter((el) => !el.disabled && el.getClientRects().length);
            const first = items[0],
              last = items.at(-1);
            if (!first) {
              e.preventDefault();
              dialog.focus();
            } else if (
              e.shiftKey &&
              (document.activeElement === first || document.activeElement === dialog)
            ) {
              e.preventDefault();
              last.focus();
            } else if (
              !e.shiftKey &&
              (document.activeElement === last || document.activeElement === dialog)
            ) {
              e.preventDefault();
              first.focus();
            }
          }
          const tab = e.target.closest("[role=tab]");
          if (tab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
            const list = tab.closest("[role=tablist]");
            if (!list) return;
            const tabs = [...list.querySelectorAll("[role=tab]")],
              index = tabs.indexOf(tab),
              next =
                e.key === "Home"
                  ? 0
                  : e.key === "End"
                    ? tabs.length - 1
                    : (index + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length;
            e.preventDefault();
            const identity = focusIdentity(tabs[next]);
            tabs[next].click();
            findFocus(identity)?.focus();
          }
        });
        render();
        window.__PASEO_MOCK__ = { state: st, action, render, task, recalc };
      })();
    </script>
  </body>
</html>
