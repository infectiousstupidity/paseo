 if(['skills','skilldetail','skillreview','skillproposal'].includes(k)){if(k==='skills')return `<div class="mock-breadcrumb">Tools / Skills</div><h4>Skills</h4><div class="mocksub">Host anon3 · shared + coding · effective configuration</div><div class="mock-row" data-anchor="mealie-skill"><div class="grow"><strong>mealie</strong><small>Shared · On-demand · food-core tools</small></div><button class="mock-action" data-preview-next>Inspect →</button></div><div class="mock-row"><div class="grow"><strong>adhd</strong><small>Shared · Model-invoked · small instructions</small></div><button class="mock-ghost">Inspect</button></div><div class="mock-row"><div class="grow"><strong>review-code</strong><small>Coding · On-demand · task/diff/repo</small></div><button class="mock-ghost">Inspect</button></div>`;
 if(k==='skilldetail')return `<div class="mock-breadcrumb">Tools / Skills / mealie</div><h4>mealie</h4><div class="mocksub">Shared · On-demand · skills/shared/mealie</div><div class="mock-card" data-anchor="burden"><div class="mock-kicker">Effective setup</div><div class="mock-txt" style="margin-top:9px">Loads only when selected<br>Host: anon3 · Source: skills repo<br>Mechanical validation: available</div></div><div class="mock-card"><div class="mock-kicker">Historical analysis</div><div class="mock-no" style="margin-top:8px">Attribution sample not verified</div><div class="mock-txt">No Pivolution usage denominator shown.</div></div><button class="mock-action" data-preview-next>Review skill →</button>`;
 if(k==='skillreview')return `<div class="mock-breadcrumb">Skills / mealie / Review</div><h4>Review skill</h4><div class="mocksub">Current revision pinned before any model critique</div><div class="mock-card"><div class="mock-kicker">Review depth</div><div class="mock-row">Quick · mechanical checks + local critique <span style="margin-left:auto">◉</span></div><div class="mock-row">Deep · optional independent reviews <span style="margin-left:auto">○</span></div><div class="mock-txt" style="margin:12px 0">Check frontmatter, references, scope, and token burden first.</div></div><button class="mock-action" data-anchor="review-skill" data-preview-next>Run bounded review</button>`;

 return `<div class="mock-breadcrumb">Paseo / Workspace</div><h4>Workspace</h4><div class="mock-sub">No active context</div>`}
function tourOverlay(){let s=findStep();return `<div class="tour-card"><div class="eyebrow">Guided walkthrough · ${findJourney().id} · ${state.step+1}/${findJourney().steps.length}</div><h5>${safe(s.name)}</h5><p>${safe(s.instruction)}</p><div class="tour-ctrl"><button class="secondary" data-action="prev" ${state.step===0?'disabled':''}>← Back</button><button class="secondary" data-action="tour">Exit</button><button class="end" data-action="next">${state.step===findJourney().steps.length-1?'Finish':'Next →'}</button></div></div>`}
function applyCanvasScale(){document.querySelectorAll('.screen-host').forEach(host=>{const can=host.querySelector('.screen-canvas');if(can){const scale=host.clientWidth/760;can.style.transform=`scale(${scale})`;} if(host.classList.contains('touring')){host.querySelectorAll('[data-anchor]').forEach(n=>n.classList.toggle('targeted',n.dataset.anchor===findStep().target))}})}
function render(){const oldMain=$('#main'); const scroll=window.scrollY;$('#app').innerHTML=template();applyCanvasScale();window.scrollTo(0,scroll)}
function chooseJourney(id,stay){state.journey=id;state.step=0;state.anchor='';state.draft='';state.annotating=false;state.tour=false;state.tab='feedback';state.view=stay||'journeys';render()}
function next(){if(state.step<findJourney().steps.length-1){state.step++;state.anchor='';render()}else if(state.tour){state.tour=false;render();msg('Journey complete · Mark review status in Acceptance')}}
function prev(){if(state.step>0){state.step--;state.anchor='';render()}}
function download(){let dat={schema:'paseo-ux-atlas-feedback/v1',generatedAt:new Date().toISOString(),mock:'Paseo UX Atlas',journeys:J.map(j=>({id:j.id,name:j.name,status:state.reviewStates[j.id]||'Not reviewed'})),annotations:state.feedback.map(i=>({...i,stepNumber:i.step+1}))};const b=new Blob([JSON.stringify(dat,null,2)],{type:'application/json'}),url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download='paseo-ux-atlas-feedback.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);msg('Feedback JSON exported')}
document.addEventListener('click',e=>{let t=e.target.closest('[data-view],[data-journey],[data-step],[data-node],[data-part],[data-action],[data-tab],[data-openissue],[data-preview-next],[data-anchor]');if(!t)return;
 if(t.hasAttribute('data-anchor')&&state.annotating&&t.closest('.screen-host.large')){e.preventDefault();e.stopPropagation();state.anchor=t.dataset.anchor;state.tab='feedback';const tx=$('#comment');if(tx)state.draft=tx.value;render();msg('Selected UI target: '+state.anchor);return}
 if(t.hasAttribute('data-preview-next')&&t.closest('.screen-host.large')){e.preventDefault();next();return}
 if(t.dataset.journey){chooseJourney(t.dataset.journey,t.dataset.stay);return}
 if(t.dataset.view){state.view=t.dataset.view;state.tour=false;render();return}
 if(t.dataset.step!==undefined){state.step=+t.dataset.step;state.anchor='';if(t.dataset.stay)state.view=t.dataset.stay;render();return}
 if(t.dataset.node){state.node=t.dataset.node;state.part=0;render();return}if(t.dataset.part!==undefined){state.part=+t.dataset.part;render();return}
 if(t.dataset.tab){const tx=$('#comment');if(tx)state.draft=tx.value;state.tab=t.dataset.tab;render();return}
 if(t.dataset.openissue){const i=state.feedback.find(x=>x.id===t.dataset.openissue);if(i){state.journey=i.journey;state.step=i.step;state.view='journeys';state.tab='feedback';render()}return}
 if(t.dataset.action){switch(t.dataset.action){case'next':next();break;case'prev':prev();break;case'annotate':{const tx=$('#comment');if(tx)state.draft=tx.value;state.annotating=!state.annotating;state.anchor='';render();break}case'tour':state.view='journeys';state.annotating=false;state.tour=!state.tour;render();break;case'export':download();break;case'saveFeedback':{let v=$('#comment')?.value.trim()||'';if(!v){msg('Enter feedback before saving');break}state.feedback.push({id:'fb-'+Date.now(),journey:state.journey,step:state.step,anchor:state.anchor||findStep().target,text:v,status:'Open',example:false});state.draft='';state.annotating=false;state.anchor='';persist();render();msg('Feedback saved locally');break}case'toggleIssue':{let i=state.feedback.find(x=>x.id===t.dataset.id);if(i){i.status=i.status==='Open'?'Resolved':'Open';persist();render()}break}case'resetDemo':if(confirm('Reset all local feedback and journey review states?')){state.feedback=structuredClone(defaultIssues);state.reviewStates={};state.filter='';persist();render()}break;}return}
});
document.addEventListener('change',e=>{if(e.target.id==='reviewState'){state.reviewStates[state.journey]=e.target.value;persist();render();msg('Journey review state updated')}});
document.addEventListener('input',e=>{if(e.target.id==='comment')state.draft=e.target.value;if(e.target.id==='searchFeedback'){state.filter=e.target.value;let selection=e.target.selectionStart;let current=e.target.value;render();const search=$('#searchFeedback');search.focus();search.setSelectionRange(selection,selection)}});
window.addEventListener('resize',applyCanvasScale);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(state.tour||state.annotating)){state.tour=false;state.annotating=false;render()}if(e.target instanceof HTMLElement&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='Enter'&&e.target?.classList?.contains('step-card')){state.step=+e.target.dataset.step;render();return}if(state.view==='journeys'&&e.key==='ArrowRight')next();if(state.view==='journeys'&&e.key==='ArrowLeft')prev()});
render();
