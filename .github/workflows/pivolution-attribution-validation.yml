name: Pivolution attribution validation

on:
  push:
    branches:
      - pivolution-provenance-producer

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspace=@getpaseo/server
      - run: npm run format:check -- packages/server/src/server/agent/providers/pi/agent.ts
