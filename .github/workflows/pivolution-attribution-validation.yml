name: Pivolution attribution validation

on:
  push:
    branches:
      - pivolution-provenance-producer-v2

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:server-deps
      - run: npm run typecheck --workspace=@getpaseo/server
      - name: Show formatter diff
        run: |
          npx oxfmt packages/server/src/server/agent/providers/pi/agent.ts
          git diff -- packages/server/src/server/agent/providers/pi/agent.ts
          exit 1
